                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Penjamin"
                "401":
                    description: Token tidak ada atau kadaluarsa

    /api/v1/master/depo:
        get:
