                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status perawatan
                  schema:
                      type: string
                      enum: [Semua, Ralan, Ranap]
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD)
                  schema:
                      type: string
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
