openapi: 3.1.0
info:
    title: ERM Dokter API
    version: 1.0.0
    description: |
        API Elektronik Rekam Medis (ERM) Dokter untuk Rumah Sakit & Klinik berbasis database Khanza.

        ### Fitur Utama:
        - **Authentication**: JWT Bearer Token dengan enkripsi password AES.
        - **Rawat Jalan**: Antrean pasien dokter, pencarian & filter, detail kunjungan pasien.
        - **Pemeriksaan Medis (SOAP & TTV)**: Riwayat pemeriksaan, pencatatan SOAP (Subjective, Objective, Assessment, Plan) baru, update pemeriksaan, dan penghapusan catatan dengan proteksi kepemilikan dokter & batas waktu edit rekam medis (48 jam).
        - **Resep Obat**: Riwayat peresepan obat pasien per kunjungan dan riwayat peresepan seluruh kunjungan berdasarkan No. RM (mendukung filter Ralan, Ranap, Semua, dan rentang tanggal).
        - **Security & Privacy**: Enkripsi identifier URL (`id_kunjungan`, `id_pasien`, `id_pemeriksaan`, `id_obat`) menggunakan AES-GCM URL-safe token untuk mencegah ID enumeration / scraping.
    contact:
        name: Tim Pengembang ERM Dokter
servers:
    - url: http://localhost:8082
      description: Development Server Local

security:
    - BearerAuth: []

tags:
    - name: Health
      description: Server Health Check
    - name: Auth
      description: Autentikasi Dokter & Manajemen Sesi
    - name: Master
      description: Master Data Database (Penjamin, Depo Farmasi)
    - name: Obat
      description: Katalog Obat, Ketersediaan Stok per Depo & Master Klasifikasi Obat
    - name: Rawat Jalan
      description: Antrean Pasien & Detail Kunjungan Rawat Jalan
    - name: Pemeriksaan
      description: Rekam Medis Pasien (SOAP & Tanda-Tanda Vital)
    - name: Resep
      description: Riwayat Peresepan Obat Pasien (Non-Racikan & Racikan)

components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Masukkan JWT Token yang didapatkan dari endpoint login (/api/v1/auth/login).

    schemas:
        BaseResponse:
            type: object
            properties:
                code:
                    type: integer
                    example: 200
                status:
                    type: string
                    example: OK
                message:
                    type: string
                    example: Berhasil memproses data

        ErrorResponse:
            type: object
            properties:
                code:
                    type: integer
                    example: 400
                status:
                    type: string
                    example: Bad Request
                message:
                    type: string
                    example: Terjadi kesalahan validasi atau bisnis
                errors:
                    type: object
                    additionalProperties:
                        type: string
                    example:
                        keluhan: "Keluhan wajib diisi (Subjective)"
                        tensi: "Nilai sistolik harus lebih besar dari diastolik (120/80)"

        PaginationMeta:
            type: object
            properties:
                total_records:
                    type: integer
                    example: 45
                total_pages:
                    type: integer
                    example: 3
                current_page:
                    type: integer
                    example: 1
                per_page:
                    type: integer
                    example: 20

        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                    description: Username / ID Dokter di Khanza
                    example: DRHANDI
                password:
                    type: string
                    description: Password akun dokter
                    example: "1"

        LoginData:
            type: object
            properties:
                token:
                    type: string
                    description: JWT Access Token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                kode_dokter:
                    type: string
                    description: Kode Dokter di Khanza
                    example: DR001
                nama_dokter:
                    type: string
                    description: Nama Lengkap Dokter
                    example: dr. Handi, Sp.PD

        KunjunganRawatJalan:
            type: object
            properties:
                id_kunjungan:
                    type: string
                    description: Encrypted No Rawat (URL-Safe Token)
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                id_pasien:
                    type: string
                    description: Encrypted No Rekam Medis
                    example: FJhxvVvG9GnbckdbCeD8BuDIRk96jwTiE2Ig_uGDlWyn33QNCZIo58_5pXOG
                no_rawat:
                    type: string
                    example: 2026/04/22/036934
                no_registrasi:
                    type: string
                    example: "001"
                tanggal_registrasi:
                    type: string
                    example: "2026-04-22"
                jam_registrasi:
                    type: string
                    example: "08:30:00"
                no_rekam_medis:
                    type: string
                    example: "123456"
                nama_pasien:
                    type: string
                    example: NY. SITI AMINAH
                jenis_kelamin:
                    type: string
                    example: P
                tanggal_lahir:
                    type: string
                    example: "1985-05-12"
                alamat:
                    type: string
                    example: Jl. Mawar No. 12, Jakarta
                kode_poli_asal:
                    type: string
                    example: U0001
                nama_poli_asal:
                    type: string
                    example: Poli Penyakit Dalam
                kode_dokter_asal:
                    type: string
                    example: DR001
                nama_dokter_asal:
                    type: string
                    example: dr. Handi, Sp.PD
                kode_penjamin:
                    type: string
                    example: BPJ
                nama_penjamin:
                    type: string
                    example: BPJS Kesehatan
                status_pemeriksaan:
                    type: string
                    example: Belum Periksa
                status_lanjut:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                status_bayar:
                    type: string
                    example: Sudah Bayar
                jenis_antrean:
                    type: string
                    example: Bukan Rujukan

        Penjamin:
            type: object
            properties:
                kode_penjamin:
                    type: string
                    example: BPJ
                nama:
                    type: string
                    example: BPJS KESEHATAN

        Depo:
            type: object
            properties:
                kode:
                    type: string
                    example: DPRJ
                nama:
                    type: string
                    example: Depo Rawat Jalan

        JenisObat:
            type: object
            properties:
                kode:
                    type: string
                    example: J01
                nama:
                    type: string
                    example: Tablet

        GolonganObat:
            type: object
            properties:
                kode:
                    type: string
                    example: G01
                nama:
                    type: string
                    example: Obat Bebas

        KategoriObat:
            type: object
            properties:
                kode:
                    type: string
                    example: K01
                nama:
                    type: string
                    example: Antibiotik

        Obat:
            type: object
            properties:
                id:
                    type: string
                    description: Encrypted ID Kode Obat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                kode_obat:
                    type: string
                    example: "B00001"
                nama_obat:
                    type: string
                    example: "PARACETAMOL 500MG TABLET"
                komposisi:
                    type: string
                    example: "Paracetamol 500 mg"
                harga:
                    type: string
                    example: "Rp 1.500"
                satuan:
                    type: string
                    example: "TAB"
                stok:
                    type: number
                    format: double
                    example: 250.00
                kapasitas:
                    type: number
                    format: double
                    example: 1.00
                kode_depo:
                    type: string
                    example: "DPRJ"
                nama_depo:
                    type: string
                    example: "Depo Rawat Jalan"
                kode_jenis:
                    type: string
                    example: "J01"
                nama_jenis:
                    type: string
                    example: "Tablet"
                kode_golongan:
                    type: string
                    example: "G01"
                nama_golongan:
                    type: string
                    example: "Obat Bebas"
                kode_kategori:
                    type: string
                    example: "K01"
                nama_kategori:
                    type: string
                    example: "Analgetik Antipiretik"
                stok_depo:
                    type: array
                    items:
                        $ref: "#/components/schemas/StokDepo"

        StokDepo:
            type: object
            properties:
                kode_depo:
                    type: string
                    example: DPRJ
                nama_depo:
                    type: string
                    example: Depo Rawat Jalan
                stok:
                    type: number
                    format: double
                    example: 120.00

        Resep:
            type: object
            properties:
                id:
                    type: string
                    description: Encrypted ID Nomor Resep
                    example: 2l1bLdukCaw2wBgR1XqLwbNEgwZaoreA7WooO9BjSyI
                id_kunjungan:
                    type: string
                    description: Encrypted ID Nomor Rawat Kunjungan
                    example: eN781vJ9A8Z
                no_resep:
                    type: string
                    example: "202604230001"
                no_rawat:
                    type: string
                    example: "2026/04/23/000001"
                tanggal_peresepan:
                    type: string
                    example: "2026-04-23"
                jam_peresepan:
                    type: string
                    example: "10:15:00"
                status:
                    type: string
                    example: "ralan"
                kode_dokter:
                    type: string
                    example: "DK001"
                nama_dokter:
                    type: string
                    example: "dr. Hendra Pratama, Sp.A"
                resep_dokter:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResepDokter"
                resep_dokter_racikan:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResepDokterRacikan"

        ResepDokter:
            type: object
            properties:
                id_obat:
                    type: string
                    description: Encrypted ID Kode Obat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                kode_obat:
                    type: string
                    example: "B00001"
                nama_obat:
                    type: string
                    example: "PARACETAMOL 500MG TABLET"
                jumlah:
                    type: number
                    format: double
                    example: 10.00
                satuan:
                    type: string
                    example: "TAB"
                aturan_pakai:
                    type: string
                    example: "3 x 1 tablet sesudah makan"

        ResepDokterRacikan:
            type: object
            properties:
                no_racik:
                    type: string
                    example: "1"
                nama_racik:
                    type: string
                    example: "Puyer Batuk Pilek"
                kode_racik:
                    type: string
                    example: "PULV"
                metode_racik:
                    type: string
                    example: "Puyer / Serbuk"
                jumlah_racikan:
                    type: integer
                    example: 10
                aturan_pakai:
                    type: string
                    example: "3 x 1 bungkus"
                keterangan:
                    type: string
                    example: "Sesudah makan"
                detail_racikan:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResepDokterRacikanDetail"

        ResepDokterRacikanDetail:
            type: object
            properties:
                id_obat:
                    type: string
                    description: Encrypted ID Kode Obat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                kode_obat:
                    type: string
                    example: "B00002"
                nama_obat:
                    type: string
                    example: "CTM 4MG TABLET"
                kandungan:
                    type: string
                    example: "2 mg"
                jumlah:
                    type: number
                    format: double
                    example: 5.00
                satuan:
                    type: string
                    example: "TAB"

        AturanPakai:
            type: object
            properties:
                aturan_pakai:
                    type: string
                    example: "3 x 1 tablet sesudah makan"

        MetodeRacik:
            type: object
            properties:
                kode:
                    type: string
                    example: "PULV"
                nama:
                    type: string
                    example: "Puyer / Serbuk"

        OpsiReferensi:
            type: object
            properties:
                value:
                    type: string
                    example: Compos Mentis
                label:
                    type: string
                    example: Compos Mentis

        ReferensiFilterRawatJalan:
            type: object
            properties:
                status_pemeriksaan:
                    type: array
                    items:
                        $ref: "#/components/schemas/OpsiReferensi"
                status_lanjut:
                    type: array
                    items:
                        $ref: "#/components/schemas/OpsiReferensi"
                status_bayar:
                    type: array
                    items:
                        $ref: "#/components/schemas/OpsiReferensi"
                jenis_antrean:
                    type: array
                    items:
                        $ref: "#/components/schemas/OpsiReferensi"

        DataPemeriksaanPayload:
            type: object
            required:
                - kesadaran
                - keluhan
                - pemeriksaan
                - penilaian
                - rencana_tindak_lanjut
                - instruksi
                - evaluasi
            properties:
                tanggal_pemeriksaan:
                    type: string
                    description: Format YYYY-MM-DD. Kosong saat simpan akan diisi otomatis waktu sekarang.
                    example: "2026-08-24"
                jam_pemeriksaan:
                    type: string
                    description: Format HH:mm:ss. Kosong saat simpan akan diisi otomatis waktu sekarang.
                    example: "10:30:00"
                suhu_tubuh:
                    type: string
                    description: Rentang 25.0 - 45.0 °C
                    example: "36.5"
                tensi:
                    type: string
                    description: Format Sistolik/Diastolik (sistolik > diastolik, mmHg)
                    example: "120/80"
                nadi:
                    type: string
                    description: 20 - 300 x/menit
                    example: "80"
                respirasi:
                    type: string
                    description: 5 - 100 x/menit
                    example: "20"
                tinggi_badan:
                    type: string
                    description: 20 - 250 cm
                    example: "170"
                berat_badan:
                    type: string
                    description: 0.5 - 500 kg
                    example: "65"
                spo2:
                    type: string
                    description: 0 - 100 %
                    example: "98"
                gcs:
                    type: string
                    description: Glasgow Coma Scale (maks 10 karakter)
                    example: "15"
                kesadaran:
                    type: string
                    enum:
                        [
                            Compos Mentis,
                            Somnolence,
                            Sopor,
                            Coma,
                            Alert,
                            Confusion,
                            Voice,
                            Pain,
                            Unresponsive,
                            Apatis,
                            Delirium,
                        ]
                    example: Compos Mentis
                keluhan:
                    type: string
                    description: Anamnesis / Subjective (S)
                    example: Pasien mengeluh demam sejak 3 hari yang lalu disertai pusing
                pemeriksaan:
                    type: string
                    description: Pemeriksaan Fisik / Objective (O)
                    example: Keadaan umum sedang, faring hiperemis, ronki -/-, wheezing -/-
                alergi:
                    type: string
                    description: Riwayat Alergi Obat/Makanan
                    example: Tidak ada riwayat alergi obat
                lingkar_perut:
                    type: string
                    description: Khusus Rawat Jalan (cm)
                    example: "80"
                rencana_tindak_lanjut:
                    type: string
                    description: Plan / Rencana Tindak Lanjut (P)
                    example: Kontrol poli 3 hari kemudian jika demam belum turun
                penilaian:
                    type: string
                    description: Diagnosis / Assessment (A)
                    example: Febris H-3 e.c Susp. Viral Infection
                instruksi:
                    type: string
                    description: Instruksi Medis
                    example: Paracetamol 3x500mg prn demam, perbanyak minum air putih
                evaluasi:
                    type: string
                    description: Evaluasi Perkembangan Pasien
                    example: Keadaan umum stabil, tanda vital dalam batas normal

        SimpanPemeriksaanRequest:
            allOf:
                - type: object
                  required:
                      - no_rawat
                  properties:
                      no_rawat:
                          type: string
                          description: Nomor Rawat Pasien
                          example: 2026/04/22/036934
                - $ref: "#/components/schemas/DataPemeriksaanPayload"

        UpdatePemeriksaanRequest:
            $ref: "#/components/schemas/DataPemeriksaanPayload"

        Pemeriksaan:
            type: object
            properties:
                id:
                    type: string
                    description: Encrypted Composite Key ID Pemeriksaan
                    example: 0OtIQUN58_TX288rUimqIL-JwoAcmb0jHhKwvI3ENmOhgKYk1Nvo36U26mjhY-Ki_Sb7cFjXgvQXxjWCnCWNaxs
                id_kunjungan:
                    type: string
                    description: Encrypted No Rawat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                no_rawat:
                    type: string
                    example: 2026/04/22/036934
                tanggal_pemeriksaan:
                    type: string
                    example: "2026-08-24"
                jam_pemeriksaan:
                    type: string
                    example: "10:30:00"
                suhu_tubuh:
                    type: string
                    example: "36.5"
                tensi:
                    type: string
                    example: "120/80"
                nadi:
                    type: string
                    example: "80"
                respirasi:
                    type: string
                    example: "20"
                tinggi_badan:
                    type: string
                    example: "170"
                berat_badan:
                    type: string
                    example: "65"
                spo2:
                    type: string
                    example: "98"
                gcs:
                    type: string
                    example: "15"
                kesadaran:
                    type: string
                    example: Compos Mentis
                keluhan:
                    type: string
                    example: Pasien mengeluh demam
                pemeriksaan:
                    type: string
                    example: Faring hiperemis
                alergi:
                    type: string
                    example: Tidak ada
                lingkar_perut:
                    type: string
                    example: "80"
                rencana_tindak_lanjut:
                    type: string
                    example: Kontrol 3 hari
                penilaian:
                    type: string
                    example: Febris H-3
                instruksi:
                    type: string
                    example: Paracetamol 3x500mg
                evaluasi:
                    type: string
                    example: Stabil
                kode_dokter_petugas:
                    type: string
                    example: DR001
                nama_dokter_petugas:
                    type: string
                    example: dr. Handi, Sp.PD
                status_lanjut:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan

paths:
    /health:
        get:
            tags: [Health]
            summary: Health Check Server
            description: Endpoint untuk memverifikasi ketersediaan dan status server.
            security: []
            responses:
                "200":
                    description: Server berjalan normal
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: integer
                                        example: 200
                                    status:
                                        type: string
                                        example: OK
                                    message:
                                        type: string
                                        example: Server is healthy

    /api/v1/auth/login:
        post:
            tags: [Auth]
            summary: Login Dokter
            description: Otentikasi menggunakan username dan password dokter Khanza. Mengembalikan token JWT yang berlaku 24 jam.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Login Berhasil
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/LoginData"
                "400":
                    description: Username/password salah atau validasi gagal
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Terlalu banyak percobaan login (Rate limit 10 req/menit)

    /api/v1/master/penjamin:
        get:
            tags: [Master]
            summary: Daftar Master Penjamin
            description: Mengambil daftar penjamin / asuransi pasien yang aktif di sistem.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar penjamin
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Penjamin"
                "401":
                    description: Token tidak ada atau kadaluarsa

    /api/v1/master/depo:
        get:
            tags: [Master]
            summary: Daftar Master Depo Farmasi
            description: Mengambil daftar bangsal / depo farmasi yang aktif.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar depo
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Depo"

    /api/v1/obat:
        get:
            tags: [Obat]
            summary: Daftar Katalog Obat & Stok Farmasi
            description: |
                Mengambil daftar katalog obat dan ketersediaan stok di depo farmasi.
                - Mendukung pencarian teks (`keyword` pada nama obat, kode obat, atau komposisi).
                - Mendukung filter berdasarkan `kode_depo` / `depo`, `kode_jenis` / `jenis`, `kode_golongan` / `golongan`, `kode_kategori` / `kategori`.
                - Mendukung pengurutan (`order_by`: `nama_obat`, `kode_obat`, `harga`, `stok`, `nama_depo`, `nama_jenis`, `nama_golongan`, `nama_kategori`) dan `sort_order` (`ASC`, `DESC`).
                - Mendukung pagination (`page`, `limit`).
            security:
                - BearerAuth: []
            parameters:
                - name: depo
                  in: query
                  description: Filter kode depo farmasi (contoh DPRJ, DPHD, DPIGD, GDF)
                  schema:
                      type: string
                - name: jenis
                  in: query
                  description: Filter kode jenis obat
                  schema:
                      type: string
                - name: golongan
                  in: query
                  description: Filter kode golongan obat
                  schema:
                      type: string
                - name: kategori
                  in: query
                  description: Filter kode kategori obat
                  schema:
                      type: string
                - name: keyword
                  in: query
                  description: Pencarian nama obat atau komposisi (minimal 3 karakter)
                  schema:
                      type: string
                      minLength: 3
                - name: order_by
                  in: query
                  description: Kolom pengurutan data
                  schema:
                      type: string
                      default: "nama_obat"
                - name: sort_order
                  in: query
                  description: Arah pengurutan data
                  schema:
                      type: string
                      enum: [ASC, DESC]
                      default: "ASC"
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
            responses:
                "200":
                    description: Berhasil mengambil daftar obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Obat"
                                          meta:
                                              $ref: "#/components/schemas/PaginationMeta"

    /api/v1/obat/jenis:
        get:
            tags: [Obat]
            summary: Daftar Jenis Obat
            description: Mengambil daftar jenis obat.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar jenis obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
