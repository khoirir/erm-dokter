    /api/v1/resep/{id_kunjungan}/{status_lanjut}:
        get:
            tags: [Resep]
            summary: Riwayat Resep per Kunjungan
            description: Mengambil riwayat peresepan obat pasien untuk satu kunjungan tertentu (Ralan, Ranap, atau Semua).
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter jenis perawatan (Ralan, Ranap, atau Semua)
                  schema:
                      type: string
                      enum: [Ralan, Ranap, Semua]
                      example: Ralan
                - name: tanggal
                  in: query
                  required: false
                  description: Filter rentang tanggal peresepan (format YYYY-MM-DD,YYYY-MM-DD)
                  schema:
                      type: string
                      example: "2026-08-01,2026-08-27"
                - name: page
                  in: query
                  required: false
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      default: 5
            responses:
                "200":
                    description: Berhasil mengambil daftar resep
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Resep"
                                          meta:
                                              $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Status lanjut atau ID kunjungan tidak valid

        post:
            tags: [Resep]
            summary: Simpan Resep Obat Baru
            description: |
                Membuat dan menyimpan resep obat baru untuk pasien kunjungan Rawat Jalan atau Rawat Inap.
                Mendukung peresepan obat **Non-Racikan**, **Racikan**, ataupun **kombinasi keduanya**.

                ### Aturan Bisnis & Validasi:
                - Dokter pembuat otomatis diambil dari kredensial Token JWT login (`claims.KodeDokter`).
                - **Validasi Cross-Check**: Kolom `no_rawat` pada request body wajib cocok dengan hasil dekripsi `id_kunjungan` di URL.
                - **Batas Waktu Peresepan (Ralan)**: Dibatasi maksimal 48 jam dari waktu registrasi kunjungan pasien.
                - **Status Kamar Inap (Ranap)**: Pasien yang dirawat inap aktif hanya dapat diresepkan berstatus `Ranap`.
                - **Atomisitas Database**: Transaksi disimpan secara atomik ke tabel `resep_obat`, `resep_dokter`, `resep_dokter_racikan`, dan `resep_dokter_racikan_detail`.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Jenis perawatan (Ralan atau Ranap)
                  schema:
                      type: string
                      enum: [Ralan, Ranap]
                      example: Ralan
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanResepRequest"
            responses:
                "200":
                    description: Berhasil menyimpan resep obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/Resep"
                "400":
                    description: Kesalahan format input, nomor rawat tidak cocok, atau data obat kosong
                "403":
                    description: Melebihi batas waktu peresepan 48 jam
                "404":
                    description: Kunjungan atau data registrasi pasien tidak ditemukan

