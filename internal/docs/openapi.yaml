    /api/v1/pemeriksaan/pasien/{id_pasien}/{status_lanjut}:
        get:
            tags: [Pemeriksaan]
            summary: Riwayat Pemeriksaan Pasien (Lintas Kunjungan)
            description: Mengambil seluruh riwayat catatan pemeriksaan SOAP & TTV seorang pasien dari semua kunjungan berdasarkan token terenkripsi `id_pasien` (no_rkm_medis).
            security:
                - BearerAuth: []
            parameters:
                - name: id_pasien
                  in: path
                  required: true
                  description: Token terenkripsi ID Pasien (no_rkm_medis)
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status perawatan
                  schema:
                      type: string
                      enum: [Semua, Ralan, Ranap]
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD)
                  schema:
                      type: string
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
            responses:
                "200":
                    description: Berhasil mengambil riwayat pemeriksaan pasien
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Pemeriksaan"
                                          meta:
                                              $ref: "#/components/schemas/PaginationMeta"

    /api/v1/pemeriksaan/{id_kunjungan}/{status_lanjut}:
        get:
            tags: [Pemeriksaan]
            summary: Riwayat Pemeriksaan per Kunjungan
            description: Mengambil riwayat catatan pemeriksaan SOAP & TTV pada 1 kunjungan pasien tertentu berdasarkan token terenkripsi `id_kunjungan` (no_rawat).
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Kunjungan (no_rawat)
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status perawatan
                  schema:
                      type: string
                      enum: [Semua, Ralan, Ranap]
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD)
                  schema:
                      type: string
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
            responses:
                "200":
                    description: Berhasil mengambil riwayat pemeriksaan kunjungan
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Pemeriksaan"
                                          meta:
                                              $ref: "#/components/schemas/PaginationMeta"
        post:
            tags: [Pemeriksaan]
            summary: Simpan Catatan Pemeriksaan Baru
            description: |
                Menyimpan catatan pemeriksaan SOAP & TTV baru pada kunjungan pasien.
                - `no_rawat` di body harus cocok dengan `id_kunjungan`.
                - Waktu pemeriksaan tidak boleh mendahului waktu registrasi pasien dan tidak boleh melebihi waktu saat ini.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Kunjungan
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  schema:
                      type: string
                      enum: [Ralan, Ranap]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPemeriksaanRequest"
            responses:
                "201":
                    description: Pemeriksaan berhasil disimpan
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/Pemeriksaan"
                "400":
                    description: Validasi klinis gagal atau duplikasi waktu pemeriksaan

    /api/v1/pemeriksaan/{id_kunjungan}/{status_lanjut}/{id_pemeriksaan}:
        get:
            tags: [Pemeriksaan]
