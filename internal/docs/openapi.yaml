                jam_permintaan:
                    type: string
                    example: "08:30:00"
                tanggal_sampel:
                    type: string
                    example: ""
                jam_sampel:
                    type: string
                    example: ""
                tanggal_hasil:
                    type: string
                    example: ""
                jam_hasil:
                    type: string
                    example: ""
                kode_dokter_perujuk:
                    type: string
                    example: "DR01"
                nama_dokter_perujuk:
                    type: string
                    example: "dr. Handi, Sp.B"
                status:
