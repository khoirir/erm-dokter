    /api/v1/rujukan-internal/{id_kunjungan}:
        get:
            tags: [Rujukan Internal]
            summary: Daftar Rujukan Internal Pasien per Kunjungan
            description: Mengambil seluruh rujukan internal / konsul antar-poli yang dibuat untuk kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                      type: string
            responses:
                "200":
                    description: Berhasil mengambil daftar rujukan internal
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/RujukanInternal"
                "400":
                    description: ID kunjungan tidak valid
                "401":
                    description: Token tidak ada atau kadaluarsa

        post:
            tags: [Rujukan Internal]
            summary: Simpan Rujukan Internal Baru
            description: |
                Menyimpan rujukan internal pasien ke dokter dan poliklinik lain.
                
                ### Aturan Bisnis & Validasi:
                - **Proteksi Diri Sendiri**: Dokter tidak dapat membuat rujukan internal ke dirinya sendiri.
                - **Proteksi Duplikasi**: Pasien tidak dapat dirujuk ke dokter yang sama lebih dari 1 kali pada kunjungan yang sama.
                - **Proteksi Batas Waktu 48 Jam**: Pembuatan rujukan ditolak jika waktu registrasi rawat jalan telah melewati batas waktu 48 jam.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanRujukanRequest"
            responses:
                "201":
                    description: Berhasil menyimpan rujukan internal
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/RujukanInternal"
                "400":
                    description: ID tujuan tidak valid, format JSON salah, atau duplikasi rujukan
                "403":
                    description: Melebihi batas waktu maksimal 48 jam
                "404":
                    description: Data kunjungan pasien tidak ditemukan

    /api/v1/rujukan-internal/{id_kunjungan}/{id_rujukan}:
        delete:
            tags: [Rujukan Internal]
            summary: Batalkan / Hapus Rujukan Internal
            description: |
                Membatalkan rujukan internal pasien yang telah dibuat.
                
                ### Aturan Bisnis:
                - **Validasi Kunjungan**: ID rujukan harus cocok dengan ID kunjungan pasien pada URL.
                - **Proteksi Batas Waktu 48 Jam**: Pembatalan rujukan ditolak jika telah melewati batas waktu 48 jam.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                - name: id_rujukan
                  in: path
                  required: true
                  description: Encrypted Composite Key ID Rujukan (NoRawat~KodePoli~KodeDokter)
                  schema:
                      type: string
            responses:
                "200":
                    description: Berhasil membatalkan rujukan internal
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "400":
                    description: ID kunjungan atau ID rujukan tidak valid
                "403":
                    description: Melebihi batas waktu 48 jam atau ID rujukan tidak cocok dengan kunjungan
                "404":
                    description: Data rujukan internal tidak ditemukan

