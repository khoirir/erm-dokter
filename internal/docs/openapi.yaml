    /api/v1/obat:
        get:
            tags: [Obat]
            summary: Daftar Katalog Obat & Stok Farmasi
            description: |
                Mengambil daftar katalog obat dan ketersediaan stok di depo farmasi.
                - Mendukung pencarian teks (`keyword` pada nama obat, kode obat, atau komposisi).
                - Mendukung filter berdasarkan `kode_depo` / `depo`, `kode_jenis` / `jenis`, `kode_golongan` / `golongan`, `kode_kategori` / `kategori`.
                - Mendukung pengurutan (`order_by`: `nama_obat`, `kode_obat`, `harga`, `stok`, `nama_depo`, `nama_jenis`, `nama_golongan`, `nama_kategori`) dan `sort_order` (`ASC`, `DESC`).
                - Mendukung pagination (`page`, `limit`).
            security:
                - BearerAuth: []
            parameters:
                - name: depo
                  in: query
                  description: Filter kode depo farmasi (contoh DPRJ, DPHD, DPIGD, GDF)
                  schema:
                      type: string
                - name: jenis
                  in: query
                  description: Filter kode jenis obat
                  schema:
                      type: string
                - name: golongan
                  in: query
                  description: Filter kode golongan obat
                  schema:
                      type: string
                - name: kategori
                  in: query
                  description: Filter kode kategori obat
                  schema:
                      type: string
                - name: keyword
                  in: query
                  description: Pencarian nama obat atau komposisi (minimal 3 karakter)
                  schema:
                      type: string
                      minLength: 3
                - name: order_by
                  in: query
                  description: Kolom pengurutan data
                  schema:
                      type: string
                      default: "nama_obat"
                - name: sort_order
                  in: query
                  description: Arah pengurutan data
                  schema:
                      type: string
                      enum: [ASC, DESC]
                      default: "ASC"
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
            responses:
                "200":
                    description: Berhasil mengambil daftar obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/Obat"
                                          meta:
                                              $ref: "#/components/schemas/PaginationMeta"

    /api/v1/obat/{id_obat}:
        get:
            tags: [Obat]
            summary: Detail Obat & Rincian Stok per Depo
            description: Mengambil informasi detail satu obat beserta breakdown ketersediaan stok di seluruh depo farmasi.
            security:
                - BearerAuth: []
            parameters:
                - name: id_obat
                  in: path
                  required: true
                  description: Encrypted ID kode obat
                  schema:
                      type: string
                  example: "2l1bLdukCaw2wBgR1XqLwbNEgwZaoreA7WooO9BjSyI"
            responses:
                "200":
                    description: Berhasil mengambil detail obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/Obat"
                "400":
                    description: ID obat tidak valid
                "404":
                    description: Data obat tidak ditemukan

    /api/v1/obat/jenis:
        get:
            tags: [Obat]
