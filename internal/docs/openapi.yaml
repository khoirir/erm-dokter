openapi: 3.1.0
info:
    title: ERM Dokter API
    version: 1.0.0
    description: |
        API Elektronik Rekam Medis (ERM) Dokter untuk Rumah Sakit & Klinik berbasis database Khanza.

        ### Fitur Utama:
        - **Authentication**: JWT Bearer Token dengan enkripsi password AES.
        - **Rawat Jalan**: Antrean pasien dokter, pencarian & filter, detail kunjungan pasien.
        - **Pemeriksaan Medis (SOAP & TTV)**: Riwayat pemeriksaan, pencatatan SOAP (Subjective, Objective, Assessment, Plan) baru, update pemeriksaan, dan penghapusan catatan dengan proteksi kepemilikan dokter & batas waktu edit rekam medis (48 jam).
        - **Resep Obat**: Riwayat peresepan obat pasien per kunjungan dan riwayat peresepan seluruh kunjungan berdasarkan No. RM (mendukung filter Ralan, Ranap, Semua, dan rentang tanggal).
        - **Security & Privacy**: Enkripsi identifier URL (`id_kunjungan`, `id_pasien`, `id_pemeriksaan`, `id_obat`) menggunakan AES-GCM URL-safe token untuk mencegah ID enumeration / scraping.
    contact:
        name: Tim Pengembang ERM Dokter
servers:
    - url: http://192.168.30.153:8082
      description: Development Server (LAN / 192.168.30.153)
    - url: http://localhost:8082
      description: Development Server (Localhost)

security:
    - BearerAuth: []

tags:
    - name: Health
      description: Server Health Check
    - name: Auth
      description: Autentikasi Dokter & Manajemen Sesi
    - name: Master
      description: Master Data Database (Penjamin, Depo Farmasi, Poliklinik)
    - name: Obat
      description: Katalog Obat, Ketersediaan Stok per Depo & Master Klasifikasi Obat
    - name: Rawat Jalan
      description: Antrean Pasien & Detail Kunjungan Rawat Jalan
    - name: Pemeriksaan
      description: Rekam Medis Pasien (SOAP & Tanda-Tanda Vital)
    - name: Resep
      description: Riwayat Peresepan Obat Pasien (Non-Racikan & Racikan)
    - name: Rujukan Internal
      description: Konsul & Rujukan Pasien Antar Poliklinik / Dokter Internal RS
    - name: Penilaian Medis
      description: Asesmen & Penilaian Awal Medis Pasien (Rawat Jalan / Ralan, Ranap, IGD)
    - name: Tindakan
      description: Master Data & Katalog Tindakan Medis / Laboratorium
    - name: Laboratorium
      description: Hasil & Permintaan Pemeriksaan Laboratorium Pasien (PK, PA, MB)
    - name: Radiologi
      description: Hasil Ekspertise & Link Gambar PACS Radiologi Pasien
    - name: Berkas Digital
      description: Berkas Digital Universal Perawatan Pasien

components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Masukkan JWT Token yang didapatkan dari endpoint login (/api/v1/auth/login).

    schemas:
        BaseResponse:
            type: object
            properties:
                code:
                    type: integer
                    example: 200
                status:
                    type: string
                    example: OK
                message:
                    type: string
                    example: Berhasil memproses data

        ErrorResponse:
            type: object
            properties:
                code:
                    type: integer
                    example: 400
                status:
                    type: string
                    example: Bad Request
                message:
                    type: string
                    example: Terjadi kesalahan validasi atau bisnis
                errors:
                    type: object
                    additionalProperties:
                        type: string
                    example:
                        keluhan: "Keluhan wajib diisi (Subjective)"
                        tensi: "Nilai sistolik harus lebih besar dari diastolik (120/80)"

        PaginationMeta:
            type: object
            properties:
                total_records:
                    type: integer
                    example: 45
                total_pages:
                    type: integer
                    example: 3
                current_page:
                    type: integer
                    example: 1
                per_page:
                    type: integer
                    example: 20

        ItemPemeriksaanLabPKRequest:
            type: object
            required:
                - id_tindakan
            properties:
                id_tindakan:
                    type: string
                    description: Token terenkripsi ID tindakan laboratorium
                    example: "w9K2m1..."
                id_template:
                    type: array
                    description: List token terenkripsi ID sub-template pengujian lab yang dipilih
                    items:
                        type: string
                    example: ["j7Nx1...", "b3K9m..."]

        SimpanPermintaanLabPKRequest:
            type: object
            required:
                - no_rawat
                - tanggal_permintaan
                - jam_permintaan
                - diagnosa_klinis
                - pemeriksaan
            properties:
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan pasien (wajib sama dengan ID kunjungan)
                    example: "2026/09/03/000001"
                tanggal_permintaan:
                    type: string
                    format: date
                    description: Tanggal permintaan (YYYY-MM-DD)
                    example: "2026-09-03"
                jam_permintaan:
                    type: string
                    description: Jam permintaan (HH:mm:ss atau HH:mm)
                    example: "10:00:00"
                diagnosa_klinis:
                    type: string
                    description: Diagnosa klinis / indikasi pemeriksaan
                    example: "Febris H-3 suspect DHF"
                informasi_tambahan:
                    type: string
                    description: Informasi tambahan / catatan klinis untuk analis lab (default '-')
                    example: "Cito segera"
                pemeriksaan:
                    type: array
                    description: Daftar tindakan lab dan sub-template pengujian yang dipesan
                    items:
                        $ref: "#/components/schemas/ItemPemeriksaanLabPKRequest"

        DetailTemplateLabPKItem:
            type: object
            properties:
                id_template:
                    type: string
                    description: Token terenkripsi ID template pengujian
                    example: "j7Nx1..."
                nama_pemeriksaan:
                    type: string
                    example: "Hemoglobin"
                satuan:
                    type: string
                    example: "g/dL"
                nilai_rujukan:
                    type: string
                    example: "12-16"
                status_bayar:
                    type: string
                    example: "Belum"

        PemeriksaanLabPKItem:
            type: object
            properties:
                id_tindakan:
                    type: string
                    description: Token terenkripsi ID tindakan laboratorium
                    example: "w9K2m1..."
                kode_tindakan:
                    type: string
                    example: "LAB001"
                nama_tindakan:
                    type: string
                    example: "Darah Lengkap"
                status_bayar:
                    type: string
                    example: "Belum"
                detail_template:
                    type: array
                    items:
                        $ref: "#/components/schemas/DetailTemplateLabPKItem"

        PermintaanLabPK:
            type: object
            properties:
                id:
                    type: string
                    description: Token terenkripsi ID nomor permintaan laboratorium
                    example: "p1K8x..."
                no_permintaan:
                    type: string
                    example: "PK202609030001"
                id_kunjungan:
                    type: string
                    description: Token terenkripsi ID kunjungan pasien
                    example: "w9K2m1..."
                no_rawat:
                    type: string
                    example: "2026/09/03/000001"
                tanggal_permintaan:
                    type: string
                    format: date
                    example: "2026-09-03"
                jam_permintaan:
                    type: string
                    example: "10:00:00"
                tanggal_sampel:
                    type: string
                    example: "0000-00-00"
                jam_sampel:
                    type: string
                    example: "00:00:00"
                tanggal_hasil:
                    type: string
                    example: "0000-00-00"
                jam_hasil:
                    type: string
                    example: "00:00:00"
                kode_dokter_perujuk:
                    type: string
                    example: "DR01"
                nama_dokter_perujuk:
                    type: string
                    example: "dr. Handi, Sp.PK"
                status:
                    type: string
                    example: "ralan"
                informasi_tambahan:
                    type: string
                    example: "-"
                diagnosa_klinis:
                    type: string
                    example: "Febris H-3"
                status_proses:
                    type: string
                    example: "Menunggu Sampel"

        DetailPermintaanLabPK:
            allOf:
                - $ref: "#/components/schemas/PermintaanLabPK"
                - type: object
                  properties:
                      pemeriksaan:
                          type: array
                          items:
                              $ref: "#/components/schemas/PemeriksaanLabPKItem"

        ItemPemeriksaanLabPARequest:
            type: object
            required:
                - id_tindakan
            properties:
                id_tindakan:
                    type: string
                    description: Token terenkripsi ID tindakan laboratorium PA
                    example: "w9K2m1..."

        SimpanPermintaanLabPARequest:
            type: object
            required:
                - no_rawat
                - tanggal_permintaan
                - jam_permintaan
                - diagnosa_klinis
                - pemeriksaan
            properties:
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan pasien (wajib sama dengan ID kunjungan)
                    example: "2026/09/04/000001"
                tanggal_permintaan:
                    type: string
                    format: date
                    description: Tanggal permintaan (YYYY-MM-DD)
                    example: "2026-09-04"
                jam_permintaan:
                    type: string
                    description: Jam permintaan (HH:mm:ss atau HH:mm)
                    example: "08:30:00"
                diagnosa_klinis:
                    type: string
                    maxLength: 80
                    description: Diagnosa klinis / indikasi pemeriksaan PA
                    example: "Susp. Ca Mammae"
                informasi_tambahan:
                    type: string
                    maxLength: 60
                    description: Catatan / informasi tambahan klinis (default '-')
                    example: "-"
                pengambilan_bahan:
                    type: string
                    format: date
                    description: Tanggal pengambilan bahan/jaringan (YYYY-MM-DD, opsional, default sama dengan tanggal permintaan jika tidak diisi)
                    example: "2026-09-04"
                diperoleh_dengan:
                    type: string
                    maxLength: 40
                    description: Cara perolehan jaringan/spesimen (opsional)
                    example: "Biopsi Eksisi"
                lokasi_jaringan:
                    type: string
                    maxLength: 40
                    description: Lokasi pengambilan jaringan (opsional)
                    example: "Mammae Dextra"
                diawetkan_dengan:
                    type: string
                    maxLength: 40
                    description: Larutan fiksatif pengawet (opsional)
                    example: "Formalin Buffer 10%"
                pernah_dilakukan_di:
                    type: string
                    maxLength: 100
                    description: Riwayat pemeriksaan PA sebelumnya di faskes (opsional)
                    example: "RSUD Lain"
                tanggal_pa_sebelumnya:
                    type: string
                    description: Tanggal PA sebelumnya (YYYY-MM-DD, opsional, default "0000-00-00" jika kosong)
                    example: "2025-01-10"
                nomor_pa_sebelumnya:
                    type: string
                    maxLength: 20
                    description: Nomor register PA sebelumnya (opsional)
                    example: "PA250001"
                diagnosa_pa_sebelumnya:
                    type: string
                    maxLength: 100
                    description: Diagnosa / hasil PA sebelumnya (opsional)
                    example: "Fibroadenoma Mammae"
                pemeriksaan:
