                jenis_kelamin:
                    type: string
                    example: P
                tanggal_lahir:
                    type: string
                    example: "1985-05-12"
                alamat:
                    type: string
                    example: Jl. Mawar No. 12, Jakarta
                kode_poli_asal:
                    type: string
                    example: U0001
                nama_poli_asal:
                    type: string
                    example: Poli Penyakit Dalam
                kode_dokter_asal:
                    type: string
                    example: DR001
                nama_dokter_asal:
                    type: string
                    example: dr. Handi, Sp.PD
                kode_penjamin:
                    type: string
                    example: BPJ
                nama_penjamin:
                    type: string
                    example: BPJS Kesehatan
                status_pemeriksaan:
                    type: string
                    example: Belum Periksa
                status_lanjut:
                    type: string
