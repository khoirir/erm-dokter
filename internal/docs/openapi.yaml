                lokasi_jaringan:
                    type: string
                    example: "Mammae Dextra"
                diawetkan_dengan:
                    type: string
                    example: "Formalin Buffer 10%"
                pernah_dilakukan_di:
                    type: string
                    example: "RSUD Lain"
                tanggal_pa_sebelumnya:
                    type: string
                    example: "2025-01-10"
                nomor_pa_sebelumnya:
                    type: string
                    example: "PA250001"
                diagnosa_pa_sebelumnya:
                    type: string
                    example: "Fibroadenoma Mammae"
                status_proses:
                    type: string
                    example: "Menunggu Sampel"

        DetailPermintaanLabPA:
            allOf:
                - $ref: "#/components/schemas/PermintaanLabPA"
                - type: object
                  properties:
                      pemeriksaan:
                          type: array
                          items:
                              $ref: "#/components/schemas/PemeriksaanLabPAItem"

        ItemPemeriksaanLabMBRequest:
            type: object
            required:
                - id_tindakan
            properties:
                id_tindakan:
                    type: string
                    description: Token terenkripsi ID tindakan laboratorium MB
                    example: "w9K2m1..."
                id_template:
