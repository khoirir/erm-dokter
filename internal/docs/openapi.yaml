                detail_pa:
                    $ref: "#/components/schemas/HasilLabPA"

        HasilLaboratoriumKunjungan:
            type: object
            properties:
                hasil_pemeriksaan:
                    type: array
                    items:
                        $ref: "#/components/schemas/HasilLaboratorium"
                berkas_digital:
                    type: array
                    items:
                        $ref: "#/components/schemas/BerkasDigital"

        HasilRadiologi:
            type: object
            properties:
                id:
                    type: string
                    description: Composite identifier hasil radiologi terenkripsi URL-safe (noRawat~kodeTindakan~tanggalPeriksa~jamPeriksa)
                    example: "hS8xP1..."
                id_kunjungan:
                    type: string
                    description: Identifier kunjungan terenkripsi URL-safe
                    example: "kR2mZ9..."
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan
                    example: "2026/04/22/000001"
                kode_tindakan:
                    type: string
                    description: Kode pemeriksaan radiologi
                    example: "RAD001"
                nama_tindakan:
                    type: string
                    description: Nama pemeriksaan radiologi
                    example: "Rontgen Thorax AP/PA"
                status:
                    type: string
                    description: Status pelayanan (Ralan / Ranap)
                    example: "Ralan"
                tanggal_periksa:
                    type: string
                    format: date
                    example: "2026-04-22"
                jam_periksa:
                    type: string
                    example: "10:00:00"
                dokter_perujuk:
                    type: object
                    properties:
                        kode_dokter:
                            type: string
                            example: "DR001"
                        nama_dokter:
                            type: string
                            example: "dr. Handi"
                dokter_radiologi:
                    type: object
                    properties:
                        kode_dokter:
                            type: string
                            example: "DR002"
                        nama_dokter:
                            type: string
                            example: "dr. Spesialis Radiologi, Sp.Rad"
                petugas:
                    type: object
                    properties:
                        nip:
                            type: string
                            example: "P001"
                        nama:
                            type: string
                            example: "Radiografer"
                hasil:
                    type: string
                    description: Teks bacaan / ekspertise hasil pemeriksaan radiologi
                    example: "Cor dan pulmo dalam batas normal. Tidak tampak infiltrat aktif."
                gambar_pacs:
                    type: array
                    items:
                        type: string
                    description: Daftar URL viewer PACS DICOM pasien
                    example: ["http://pacs.rsudkarsahusadabatu.com/explore_v5.asp?token=xyz..."]

paths:
    /health:
        get:
            tags: [Health]
            summary: Health Check Server
            description: Endpoint untuk memverifikasi ketersediaan dan status server.
            security: []
            responses:
                "200":
                    description: Server berjalan normal
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: integer
                                        example: 200
                                    status:
                                        type: string
                                        example: OK
                                    message:
                                        type: string
                                        example: Server is healthy

    /api/v1/auth/login:
        post:
            tags: [Auth]
            summary: Login Dokter
            description: Otentikasi menggunakan username dan password dokter Khanza. Mengembalikan token JWT yang berlaku 24 jam.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Login Berhasil
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/LoginData"
                "400":
                    description: Format request JSON tidak valid atau validasi input gagal
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: Username atau password salah
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Terlalu banyak percobaan login (Rate limit 10 req/menit)

    /api/v1/auth/logout:
        post:
            tags: [Auth]
            summary: Logout Dokter
            description: |
                Endpoint logout untuk mengakhiri sesi dokter dan menginstruksikan client untuk membersihkan Bearer Token JWT.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Logout Berhasil
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "401":
                    description: Token tidak ada atau sudah kadaluarsa

    /api/v1/master/penjamin:
        get:
            tags: [Master]
