            responses:
                "200":
                    description: Berhasil mengambil opsi dokter dan poliklinik rujukan
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
