                    example: 2026/04/22/036934
                no_registrasi:
                    type: string
                    example: "001"
                tanggal_registrasi:
                    type: string
                    example: "2026-04-22"
                jam_registrasi:
                    type: string
                    example: "08:30:00"
                no_rekam_medis:
                    type: string
                    example: "123456"
                nama_pasien:
                    type: string
