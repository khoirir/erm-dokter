    /api/v1/pemeriksaan/{id_kunjungan}/{status_lanjut}/{id_pemeriksaan}:
        get:
            tags: [Pemeriksaan]
            summary: Detail Catatan Pemeriksaan
            description: Mengambil detail satu catatan pemeriksaan SOAP & TTV berdasarkan ID Pemeriksaan.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Kunjungan
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  schema:
                      type: string
                      enum: [Ralan, Ranap]
                - name: id_pemeriksaan
                  in: path
                  required: true
                  description: Encrypted Composite Key ID Pemeriksaan
                  schema:
                      type: string
            responses:
                "200":
                    description: Detail pemeriksaan ditemukan
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/Pemeriksaan"
                "404":
                    description: Data pemeriksaan tidak ditemukan

        put:
            tags: [Pemeriksaan]
            summary: Update Catatan Pemeriksaan
            description: |
                Memperbarui catatan pemeriksaan SOAP & TTV.
                - Hanya dokter pembuat (`nip`) yang berhak memperbarui.
                - Batas waktu perubahan rekam medis maksimal 48 jam sejak pemeriksaan dibuat.
                - Tanggal dan jam pemeriksaan juga dapat diperbarui selama valid dan tidak duplikat.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Kunjungan
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  schema:
                      type: string
                      enum: [Ralan, Ranap]
                - name: id_pemeriksaan
                  in: path
                  required: true
                  description: Encrypted Composite Key ID Pemeriksaan
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePemeriksaanRequest"
            responses:
                "200":
                    description: Berhasil memperbarui data pemeriksaan
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/Pemeriksaan"
                "400":
                    description: Validasi input gagal
                "403":
                    description: Ditolak karena bukan dokter pembuat atau telah melewati batas waktu 48 jam
                "404":
                    description: Data pemeriksaan tidak ditemukan

        delete:
            tags: [Pemeriksaan]
            summary: Hapus Catatan Pemeriksaan
            description: |
                Menghapus catatan pemeriksaan dari database.
                - Hanya dokter pembuat (`nip`) yang berhak menghapus.
                - Batas waktu maksimal penghapusan 48 jam sejak pemeriksaan dibuat.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Kunjungan
                  schema:
                      type: string
                - name: status_lanjut
                  in: path
                  required: true
                  schema:
                      type: string
                      enum: [Ralan, Ranap]
                - name: id_pemeriksaan
                  in: path
                  required: true
                  description: Encrypted Composite Key ID Pemeriksaan
                  schema:
                      type: string
            responses:
                "200":
                    description: Berhasil menghapus data pemeriksaan
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "403":
                    description: Ditolak karena bukan dokter pembuat atau melebihi batas waktu 48 jam
                "404":
                    description: Data pemeriksaan tidak ditemukan

