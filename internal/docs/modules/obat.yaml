components:
    schemas:
        JenisObat:
            type: object
            required:
                - kode
                - nama
            properties:
                kode:
                    type: string
                    description: Kode satuan / jenis sediaan obat
                    example: "TAB"
                nama:
                    type: string
                    description: Nama satuan / jenis sediaan obat
                    example: "Tablet"
        GolonganObat:
            type: object
            required:
                - kode
                - nama
            properties:
                kode:
                    type: string
                    description: Kode golongan obat
                    example: "G01"
                nama:
                    type: string
                    description: Nama golongan obat
                    example: "Obat Bebas"
        KategoriObat:
            type: object
            required:
                - kode
                - nama
            properties:
                kode:
                    type: string
                    description: Kode kategori obat
                    example: "K01"
                nama:
                    type: string
                    description: Nama kategori obat
                    example: "Antibiotik"
        Obat:
            type: object
            required:
                - id
                - kode_obat
                - nama_obat
                - harga
                - satuan
                - stok
                - kapasitas
                - kode_jenis
                - nama_jenis
                - kode_golongan
                - nama_golongan
                - kode_kategori
                - nama_kategori
            properties:
                id:
                    type: string
                    description: Token ID kode obat terenkripsi URL-safe
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
                kode_obat:
                    type: string
                    description: Kode obat internal Khanza (tabel `databarang`)
                    example: "B00001"
                nama_obat:
                    type: string
                    description: Nama lengkap barang / obat
                    example: "PARACETAMOL 500MG TABLET"
                komposisi:
                    type: string
                    description: Komposisi / kandungan zat aktif obat
                    example: "Paracetamol 500 mg"
                harga:
                    type: string
                    description: Format rupiah harga obat
                    example: "Rp 1.500"
                satuan:
                    type: string
                    description: Satuan kemasan obat
                    example: "TAB"
                stok:
                    type: number
                    format: double
                    description: Jumlah stok tersedia (sesuai depo filter atau total keseluruhan)
                    example: 250.00
                kapasitas:
                    type: number
                    format: double
                    description: Kapasitas per kemasan
                    example: 1.00
                kode_depo:
                    type: string
                    description: Kode depo farmasi (hanya terisi jika parameter depo disertakan)
                    example: "DPRJ"
                nama_depo:
                    type: string
                    description: Nama depo farmasi (hanya terisi jika parameter depo disertakan)
                    example: "Depo Rawat Jalan"
                kode_jenis:
                    type: string
                    description: Kode jenis sediaan obat
                    example: "TAB"
                nama_jenis:
                    type: string
                    description: Nama jenis sediaan obat
                    example: "Tablet"
                kode_golongan:
                    type: string
                    description: Kode golongan obat
                    example: "G01"
                nama_golongan:
                    type: string
                    description: Nama golongan obat
                    example: "Obat Bebas"
                kode_kategori:
                    type: string
                    description: Kode kategori obat
                    example: "K01"
                nama_kategori:
                    type: string
                    description: Nama kategori obat
                    example: "Analgetik Antipiretik"
                stok_depo:
                    type: array
                    description: Rincian ketersediaan stok di seluruh depo farmasi (hanya pada detail obat)
                    items:
                        $ref: "#/components/schemas/StokDepo"
        StokDepo:
            type: object
            required:
                - kode_depo
                - nama_depo
                - stok
            properties:
                kode_depo:
                    type: string
                    description: Kode depo farmasi
                    example: "DPRJ"
                nama_depo:
                    type: string
                    description: Nama depo farmasi
                    example: "Depo Rawat Jalan"
                stok:
                    type: number
                    format: double
                    description: Jumlah stok di depo tersebut
                    example: 120.00
