paths:
    /api/v1/obat:
        get:
            tags: [Obat]
            summary: Daftar Katalog Obat & Stok Farmasi
            description: |
                Mengambil daftar katalog obat dan ketersediaan stok di depo farmasi.
                - Mendukung pencarian teks (`keyword` pada nama obat, kode obat, atau komposisi).
                - Mendukung filter berdasarkan `kode_depo` / `depo`, `kode_jenis` / `jenis`, `kode_golongan` / `golongan`, `kode_kategori` / `kategori`.
                - Mendukung pengurutan (`order_by`: `nama_obat`, `kode_obat`, `harga`, `stok`, `nama_depo`, `nama_jenis`, `nama_golongan`, `nama_kategori`) dan `sort_order` (`ASC`, `DESC`).
                - Mendukung pagination (`page`, `limit`).
            security:
                - BearerAuth: []
            parameters:
                - name: depo
                  in: query
                  description: Filter kode depo farmasi (contoh DPRJ, DPHD, DPIGD, GDF)
                  schema:
                    type: string
                - name: jenis
                  in: query
                  description: Filter kode jenis obat
                  schema:
                    type: string
                - name: golongan
                  in: query
                  description: Filter kode golongan obat
                  schema:
                    type: string
                - name: kategori
                  in: query
                  description: Filter kode kategori obat
                  schema:
                    type: string
                - name: keyword
                  in: query
                  description: Pencarian nama obat atau komposisi (minimal 3 karakter)
                  schema:
                    type: string
                    minLength: 3
                - name: order_by
                  in: query
                  description: Kolom pengurutan data
                  schema:
                    type: string
                    default: "nama_obat"
                - name: sort_order
                  in: query
                  description: Arah pengurutan data
                  schema:
                    type: string
                    enum: [ASC, DESC]
                    default: "ASC"
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 20
            responses:
                "200":
                    description: Berhasil mengambil daftar obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                $ref: "#/components/schemas/Obat"
                                        meta:
                                            $ref: "#/components/schemas/PaginationMeta"
    /api/v1/obat/{id_obat}:
        get:
            tags: [Obat]
            summary: Detail Obat & Rincian Stok per Depo
            description: Mengambil informasi detail satu obat beserta breakdown ketersediaan stok di seluruh depo farmasi.
            security:
                - BearerAuth: []
            parameters:
                - name: id_obat
                  in: path
                  required: true
                  description: Encrypted ID kode obat
                  schema:
                    type: string
                  example: "2l1bLdukCaw2wBgR1XqLwbNEgwZaoreA7WooO9BjSyI"
            responses:
                "200":
                    description: Berhasil mengambil detail obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            $ref: "#/components/schemas/Obat"
                "400":
                    description: ID obat tidak valid
                "404":
                    description: Data obat tidak ditemukan
    /api/v1/obat/jenis:
        get:
            tags: [Obat]
            summary: Daftar Jenis Obat
            description: Mengambil daftar jenis obat.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar jenis obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                $ref: "#/components/schemas/JenisObat"
    /api/v1/obat/golongan:
        get:
            tags: [Obat]
            summary: Daftar Golongan Obat
            description: Mengambil daftar golongan obat.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar golongan obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                $ref: "#/components/schemas/GolonganObat"
    /api/v1/obat/kategori:
        get:
            tags: [Obat]
            summary: Daftar Kategori Obat
            description: Mengambil daftar kategori obat.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar kategori obat
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                $ref: "#/components/schemas/KategoriObat"
components:
    schemas:
        JenisObat:
            type: object
            properties:
                kode:
                    type: string
                    example: J01
                nama:
                    type: string
                    example: Tablet
        GolonganObat:
            type: object
            properties:
                kode:
                    type: string
                    example: G01
                nama:
                    type: string
                    example: Obat Bebas
        KategoriObat:
            type: object
            properties:
                kode:
                    type: string
                    example: K01
                nama:
                    type: string
                    example: Antibiotik
        Obat:
            type: object
            properties:
                id:
                    type: string
                    description: Encrypted ID Kode Obat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                kode_obat:
                    type: string
                    example: "B00001"
                nama_obat:
                    type: string
                    example: "PARACETAMOL 500MG TABLET"
                komposisi:
                    type: string
                    example: "Paracetamol 500 mg"
                harga:
                    type: string
                    example: "Rp 1.500"
                satuan:
                    type: string
                    example: "TAB"
                stok:
                    type: number
                    format: double
                    example: 250.00
                kapasitas:
                    type: number
                    format: double
                    example: 1.00
                kode_depo:
                    type: string
                    example: "DPRJ"
                nama_depo:
                    type: string
                    example: "Depo Rawat Jalan"
                kode_jenis:
                    type: string
                    example: "J01"
                nama_jenis:
                    type: string
                    example: "Tablet"
                kode_golongan:
                    type: string
                    example: "G01"
                nama_golongan:
                    type: string
                    example: "Obat Bebas"
                kode_kategori:
                    type: string
                    example: "K01"
                nama_kategori:
                    type: string
                    example: "Analgetik Antipiretik"
                stok_depo:
                    type: array
                    items:
                        $ref: "#/components/schemas/StokDepo"
        StokDepo:
            type: object
            properties:
                kode_depo:
                    type: string
                    example: DPRJ
                nama_depo:
                    type: string
                    example: Depo Rawat Jalan
                stok:
                    type: number
                    format: double
                    example: 120.00
