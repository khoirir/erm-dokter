paths:
    /api/v1/obat:
        get:
            tags: [Obat]
            summary: Daftar Katalog Obat & Stok Farmasi
            description: |
                Mengambil daftar katalog obat dan ketersediaan stok di depo farmasi aktif.
                - Mendukung pencarian teks (`keyword` pada nama obat, kode obat, atau komposisi, minimal 3 karakter).
                - Mendukung filter berdasarkan `depo` (kode depo farmasi, cth: `DPRJ`, `DPRI`, `DPIGD`), `jenis`, `golongan`, dan `kategori`.
                - Mendukung pengurutan (`order_by`: `nama_obat`, `stok`, `nama_depo`, `nama_jenis`, `nama_golongan`, `nama_kategori`) dan `sort_order` (`ASC`, `DESC`).
                - Mendukung pagination (`page`, `limit`).
            security:
                - BearerAuth: []
            parameters:
                - name: depo
                  in: query
                  description: Filter kode depo farmasi (contoh DPRJ, DPRI, DPIGD, DPOK, DPHD, GDF)
                  schema:
                    type: string
                    example: "DPRJ"
                - name: jenis
                  in: query
                  description: Filter kode jenis obat (tabel `kodesatuan`)
                  schema:
                    type: string
                - name: golongan
                  in: query
                  description: Filter kode golongan obat (tabel `golongan_barang`)
                  schema:
                    type: string
                - name: kategori
                  in: query
                  description: Filter kode kategori obat (tabel `kategori_barang`)
                  schema:
                    type: string
                - name: keyword
                  in: query
                  description: Pencarian nama obat atau komposisi (minimal 3 karakter jika diisi)
                  schema:
                    type: string
                    minLength: 3
                    example: "paracetamol"
                - name: order_by
                  in: query
                  description: Kolom pengurutan data
                  schema:
                    type: string
                    enum: [nama_obat, stok, nama_depo, nama_jenis, nama_golongan, nama_kategori]
                    default: "nama_obat"
                - name: sort_order
                  in: query
                  description: Arah pengurutan data
                  schema:
                    type: string
                    enum: [ASC, DESC]
                    default: "ASC"
                - name: page
                  in: query
                  description: Nomor halaman data
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  description: Jumlah data per halaman (maksimal 100)
                  schema:
                    type: integer
                    default: 20
            responses:
                "200":
                    description: Berhasil mengambil daftar obat
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar obat
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Obat"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Parameter filter pencarian atau pengurutan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Validasi gagal
                                    error:
                                        type: object
                                        properties:
                                            keyword:
                                                type: string
                                                example: Kata kunci pencarian minimal 3 karakter
                                            order_by:
                                                type: string
                                                example: Kolom pengurutan tidak valid
                                            sort_order:
                                                type: string
                                                example: "Arah pengurutan tidak valid (pilihan: ASC, DESC)"
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/obat/{id_obat}:
        get:
            tags: [Obat]
            summary: Detail Obat & Rincian Stok per Depo
            description: Mengambil informasi detail satu obat beserta rincian ketersediaan stok di seluruh depo farmasi.
            security:
                - BearerAuth: []
            parameters:
                - name: id_obat
                  in: path
                  required: true
                  description: Token terenkripsi ID kode obat
                  schema:
                    type: string
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
            responses:
                "200":
                    description: Berhasil mengambil detail obat
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail obat
                                    data:
                                        $ref: "#/components/schemas/Obat"
                "400":
                    description: Format ID obat tidak valid atau gagal didekripsi
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID obat tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "404":
                    description: Data obat tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data obat tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
