        put:
            tags: [Pemeriksaan]
            summary: Update Catatan Pemeriksaan
            description: |
                Memperbarui catatan pemeriksaan SOAP & TTV.
                - Hanya dokter pembuat yang berhak memperbarui.
                - Batas waktu perubahan rekam medis maksimal 48 jam sejak waktu registrasi pasien (rawat jalan).
                - Memerlukan status kamar aktif (rawat inap).
                - Tanggal dan jam pemeriksaan juga dapat diperbarui selama valid dan tidak duplikat.
            security:
                - BearerAuth: []
            parameters:
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut pasien (ralan atau ranap)
                  schema:
                    type: string
                    enum: [ralan, ranap]
                    example: ralan
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Kunjungan
                  schema:
                    type: string
                - name: id_pemeriksaan
                  in: path
                  required: true
                  description: Token terenkripsi ID Pemeriksaan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePemeriksaanRequest"
            responses:
                "200":
                    description: Berhasil memperbarui data pemeriksaan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui data pemeriksaan
                                    data:
                                        $ref: "#/components/schemas/Pemeriksaan"
                "400":
                    description: Validasi input gagal, duplikasi waktu pemeriksaan, atau status kamar inap tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Validasi gagal
                                    error:
                                        type: object
                                        properties:
                                            suhu_tubuh:
                                                type: string
                                                example: Suhu tubuh harus berada dalam rentang 25.0 - 45.0 °C
                                            jam_pemeriksaan:
                                                type: string
                                                example: Pemeriksaan pada 2026-08-24 10:30:00 sudah ada
                                            tanggal_pemeriksaan:
                                                type: string
                                                example: Waktu pemeriksaan tidak boleh sebelum registrasi (2026-08-24 08:00:00)
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Ditolak karena bukan dokter pembuat atau telah melewati batas waktu 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data pemeriksaan ini diinput oleh dokter/petugas lain (dr. Budi Santoso, Sp.PD)
                "404":
                    description: Data pemeriksaan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data pemeriksaan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        delete:
            tags: [Pemeriksaan]
            summary: Hapus Catatan Pemeriksaan
            description: |
                Menghapus catatan pemeriksaan dari database.
                - Hanya dokter pembuat yang berhak menghapus.
                - Batas waktu maksimal penghapusan 48 jam sejak waktu registrasi pasien (rawat jalan).
                - Memerlukan status kamar aktif (rawat inap).
            security:
                - BearerAuth: []
            parameters:
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut pasien (ralan atau ranap)
                  schema:
                    type: string
                    enum: [ralan, ranap]
                    example: ralan
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Kunjungan
                  schema:
                    type: string
                - name: id_pemeriksaan
                  in: path
                  required: true
                  description: Token terenkripsi ID Pemeriksaan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil menghapus data pemeriksaan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menghapus data pemeriksaan
                "400":
                    description: Parameter URL tidak valid atau ID pemeriksaan tidak sesuai dengan ID kunjungan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID pemeriksaan tidak sesuai dengan ID kunjungan
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Ditolak karena bukan dokter pembuat atau melebihi batas waktu 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data pemeriksaan ini diinput oleh dokter/petugas lain (dr. Budi Santoso, Sp.PD)
                "404":
                    description: Data pemeriksaan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data pemeriksaan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
components:
    schemas:
        OpsiReferensi:
            type: object
            required:
                - value
                - label
            properties:
                value:
                    type: string
                    example: Compos Mentis
                label:
                    type: string
                    example: Compos Mentis
        DataPemeriksaanPayload:
            type: object
            required:
                - kesadaran
                - keluhan
                - pemeriksaan
                - penilaian
                - rencana_tindak_lanjut
                - instruksi
                - evaluasi
            properties:
                tanggal_pemeriksaan:
                    type: string
                    description: Format YYYY-MM-DD. Kosong saat simpan akan diisi otomatis waktu sekarang.
                    example: "2026-08-24"
                jam_pemeriksaan:
                    type: string
                    description: Format HH:mm:ss. Kosong saat simpan akan diisi otomatis waktu sekarang.
                    example: "10:30:00"
                suhu_tubuh:
                    type: string
                    description: Rentang 25.0 - 45.0 °C
                    example: "36.5"
                tensi:
                    type: string
                    description: Format Sistolik/Diastolik (sistolik > diastolik, mmHg)
                    example: "120/80"
                nadi:
                    type: string
                    description: 20 - 300 x/menit
                    example: "80"
                respirasi:
                    type: string
                    description: 5 - 100 x/menit
                    example: "20"
                tinggi_badan:
                    type: string
                    description: 20 - 250 cm
                    example: "170"
                berat_badan:
                    type: string
                    description: 0.5 - 500 kg
                    example: "65"
                spo2:
                    type: string
                    description: 0 - 100 %
                    example: "98"
                gcs:
                    type: string
                    description: Glasgow Coma Scale (maks 10 karakter)
                    example: "15"
                kesadaran:
                    type: string
                    enum: [Compos Mentis, Somnolence, Sopor, Coma, Alert, Confusion, Voice, Pain, Unresponsive, Apatis, Delirium]
                    example: Compos Mentis
                keluhan:
                    type: string
                    description: Anamnesis / Subjective (S)
                    example: Pasien mengeluh demam sejak 3 hari yang lalu disertai pusing
                pemeriksaan:
                    type: string
                    description: Pemeriksaan Fisik / Objective (O)
                    example: Keadaan umum sedang, faring hiperemis, ronki -/-, wheezing -/-
                alergi:
                    type: string
                    description: Riwayat Alergi Obat/Makanan
