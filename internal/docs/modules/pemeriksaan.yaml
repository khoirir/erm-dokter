paths:
    /api/v1/pemeriksaan/kesadaran:
        get:
            tags: [Pemeriksaan]
            summary: Referensi Tingkat Kesadaran Pasien
            description: Mengambil daftar tingkat kesadaran valid (GCS/AVPU) yang didukung sistem.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil referensi tingkat kesadaran
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil referensi tingkat kesadaran
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/OpsiReferensi"
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/pemeriksaan/{status_lanjut}/{id_kunjungan}:
        get:
            tags: [Pemeriksaan]
            summary: Riwayat Pemeriksaan per Kunjungan
            description: Mengambil riwayat catatan pemeriksaan SOAP & TTV pada 1 kunjungan pasien tertentu berdasarkan token terenkripsi `id_kunjungan`.
            security:
                - BearerAuth: []
            parameters:
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter status lanjut (semua, ralan, ranap)
                  schema:
                    type: string
                    enum: [semua, ralan, ranap]
                    example: ralan
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Kunjungan
                  schema:
                    type: string
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD)
                  schema:
                    type: string
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 20
            responses:
                "200":
                    description: Berhasil mengambil daftar pemeriksaan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar pemeriksaan
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Pemeriksaan"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Parameter status lanjut atau ID kunjungan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Status lanjut tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        post:
            tags: [Pemeriksaan]
            summary: Simpan Catatan Pemeriksaan Baru
            description: |
                Menyimpan catatan pemeriksaan SOAP & TTV baru pada kunjungan pasien.
                - `no_rawat` di body harus cocok dengan `id_kunjungan`.
                - Waktu pemeriksaan tidak boleh mendahului waktu registrasi pasien dan tidak boleh melebihi waktu saat ini.
                - Dibatasi maksimal 48 jam dari waktu registrasi untuk kunjungan rawat jalan.
                - Memerlukan status kamar aktif untuk kunjungan rawat inap.
            security:
                - BearerAuth: []
            parameters:
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut pasien (ralan atau ranap)
                  schema:
                    type: string
                    enum: [ralan, ranap]
                    example: ralan
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPemeriksaanRequest"
            responses:
                "201":
                    description: Berhasil menyimpan data pemeriksaan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan data pemeriksaan
                                    data:
                                        $ref: "#/components/schemas/Pemeriksaan"
                "400":
                    description: Validasi input klinis gagal, duplikasi waktu pemeriksaan, atau status kamar inap tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Validasi gagal
                                    error:
                                        type: object
                                        properties:
                                            suhu_tubuh:
                                                type: string
                                                example: Suhu tubuh harus berada dalam rentang 25.0 - 45.0 °C
                                            tensi:
                                                type: string
                                                example: Format tensi harus Sistolik/Diastolik (contoh 120/80)
                                            jam_pemeriksaan:
                                                type: string
                                                example: Pemeriksaan pada 2026-08-24 10:30:00 sudah ada
                                            tanggal_pemeriksaan:
                                                type: string
                                                example: Waktu pemeriksaan tidak boleh sebelum registrasi (2026-08-24 08:00:00)
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Melebihi batas waktu maksimal 48 jam rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Pemeriksaan tidak dapat disimpan, melebihi batas 48 jam
                "404":
                    description: Data registrasi kunjungan pasien tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data registrasi kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/pemeriksaan/{status_lanjut}/pasien/{id_pasien}:
        get:
            tags: [Pemeriksaan]
            summary: Riwayat Pemeriksaan Pasien (Lintas Kunjungan)
            description: Mengambil seluruh riwayat catatan pemeriksaan SOAP & TTV seorang pasien dari semua kunjungan berdasarkan token terenkripsi `id_pasien`.
            security:
                - BearerAuth: []
            parameters:
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter status lanjut (semua, ralan, ranap)
                  schema:
                    type: string
                    enum: [semua, ralan, ranap]
                    example: semua
                - name: id_pasien
                  in: path
                  required: true
                  description: Token terenkripsi ID Pasien
                  schema:
                    type: string
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD)
                  schema:
                    type: string
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 20
            responses:
                "200":
                    description: Berhasil mengambil riwayat pemeriksaan pasien
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat pemeriksaan pasien
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Pemeriksaan"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Parameter status lanjut atau ID pasien tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID pasien tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
