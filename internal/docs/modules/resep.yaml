                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data resep obat tidak ditemukan pada kunjungan ini
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        put:
            tags: [Resep]
            summary: Perbarui Resep Obat
            description: Memperbarui data resep obat pasien.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/ResepStatusLanjut"
                - $ref: "#/components/parameters/ResepIdKunjungan"
                - $ref: "#/components/parameters/ResepIdResep"
