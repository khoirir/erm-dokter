                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Akses ditolak
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Peresepan obat melewati batas waktu maksimal 48 jam
                "404":
                    description: Data resep obat tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data resep obat tidak ditemukan pada kunjungan ini
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        delete:
            tags: [Resep]
            summary: Hapus Resep Obat
            description: Menghapus atau membatalkan resep obat pasien.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/ResepStatusLanjut"
                - $ref: "#/components/parameters/ResepIdKunjungan"
                - $ref: "#/components/parameters/ResepIdResep"
            responses:
                "200":
                    description: Berhasil menghapus resep obat
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menghapus resep obat
                "400":
                    description: Parameter permintaan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Pasien BPJS sudah bayar, resep tidak dapat dihapus
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Akses ditolak
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Peresepan obat melewati batas waktu maksimal 48 jam
                "404":
                    description: Data resep obat tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data resep obat tidak ditemukan pada kunjungan ini
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
components:
    parameters:
        ResepStatusLanjutSemua:
            name: status_lanjut
            in: path
            required: true
            description: Status lanjut pelayanan (semua, ralan, ranap)
            schema:
                type: string
                enum: [semua, ralan, ranap]
                example: ralan
        ResepStatusLanjut:
            name: status_lanjut
            in: path
            required: true
            description: Status lanjut pelayanan (ralan, ranap)
            schema:
                type: string
                enum: [ralan, ranap]
                example: ralan
        ResepIdKunjungan:
            name: id_kunjungan
            in: path
            required: true
            description: ID Kunjungan pasien
            schema:
                type: string
        ResepIdPasien:
            name: id_pasien
            in: path
            required: true
            description: ID Pasien
            schema:
                type: string
        ResepIdResep:
            name: id_resep
            in: path
            required: true
            description: ID Resep obat
            schema:
                type: string
        ResepTanggalFilter:
            name: tanggal
            in: query
            required: false
            description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD)
            schema:
                type: string
                example: "2026-08-01,2026-08-27"
        ResepPageFilter:
            name: page
            in: query
            required: false
            schema:
                type: integer
                default: 1
        ResepLimitFilter:
            name: limit
            in: query
            required: false
            schema:
                type: integer
                default: 5
        ResepKeywordFilter:
            name: keyword
            in: query
            required: false
            description: Kata kunci pencarian aturan pakai (contoh "3 x 1" atau "tablet")
            schema:
                type: string
                example: "3 x 1"
    schemas:
        Resep:
            type: object
            properties:
                id:
                    type: string
                    description: ID Resep obat
                    example: 2l1bLdukCaw2wBgR1XqLwbNEgwZaoreA7WooO9BjSyI
                id_kunjungan:
                    type: string
                    description: ID Kunjungan pasien
                    example: eN781vJ9A8Z
                no_resep:
                    type: string
                    example: "202604230001"
                no_rawat:
                    type: string
                    example: "2026/04/23/000001"
                tanggal_peresepan:
                    type: string
                    example: "2026-04-23"
                jam_peresepan:
                    type: string
                    example: "10:15:00"
                status:
                    type: string
                    example: "ralan"
                kode_dokter:
                    type: string
                    example: "DK001"
                nama_dokter:
                    type: string
                    example: "dr. Hendra Pratama, Sp.A"
                resep_dokter:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResepDokter"
                resep_dokter_racikan:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResepDokterRacikan"
        ResepDokter:
            type: object
            properties:
                id_obat:
                    type: string
                    description: ID Obat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                kode_obat:
                    type: string
                    example: "B00001"
                nama_obat:
                    type: string
                    example: "PARACETAMOL 500MG TABLET"
                jumlah:
                    type: number
                    format: double
                    example: 10.00
                satuan:
                    type: string
                    example: "TAB"
                aturan_pakai:
                    type: string
                    example: "3 x 1 tablet sesudah makan"
        ResepDokterRacikan:
            type: object
            properties:
                no_racik:
                    type: string
                    example: "1"
                nama_racik:
                    type: string
                    example: "Puyer Batuk Pilek"
                kode_racik:
                    type: string
                    example: "PULV"
                metode_racik:
                    type: string
                    example: "Puyer / Serbuk"
                jumlah_racikan:
                    type: integer
                    example: 10
                aturan_pakai:
                    type: string
                    example: "3 x 1 bungkus"
                keterangan:
                    type: string
                    example: "Sesudah makan"
                detail_racikan:
                    type: array
                    items:
                        $ref: "#/components/schemas/ResepDokterRacikanDetail"
        ResepDokterRacikanDetail:
            type: object
            properties:
                id_obat:
                    type: string
                    description: ID Obat
                    example: cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_
                kode_obat:
                    type: string
                    example: "B00002"
                nama_obat:
                    type: string
                    example: "CTM 4MG TABLET"
                kandungan:
                    type: string
                    example: "2 mg"
                jumlah:
                    type: number
                    format: double
                    example: 5.00
                satuan:
                    type: string
                    example: "TAB"
        SimpanResepRequest:
            type: object
            required:
                - no_rawat
            properties:
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan pasien
                    example: "2026/04/22/036934"
                tanggal_peresepan:
                    type: string
                    description: Tanggal peresepan obat (YYYY-MM-DD)
                    example: "2026-08-28"
                jam_peresepan:
                    type: string
                    description: Jam peresepan obat (HH:mm:ss)
                    example: "10:00:00"
                resep_dokter:
                    type: array
                    description: Daftar obat non-racikan
                    items:
                        $ref: "#/components/schemas/ResepDokterInput"
                resep_racikan:
                    type: array
                    description: Daftar obat racikan
                    items:
                        $ref: "#/components/schemas/ResepRacikanInput"
        ResepDokterInput:
            type: object
            required:
                - id_obat
                - jumlah
                - aturan_pakai
            properties:
                id_obat:
                    type: string
                    description: ID Obat
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
                jumlah:
                    type: number
                    format: double
                    description: Jumlah obat
                    example: 10
                aturan_pakai:
                    type: string
                    description: Aturan pakai obat
                    example: "3 x 1 tablet sesudah makan"
        ResepRacikanInput:
            type: object
            required:
                - nama_racik
                - kode_racik
                - jumlah_racikan
                - aturan_pakai
                - detail
            properties:
                nama_racik:
                    type: string
                    description: Nama racikan
                    example: "Puyer Batuk Pilek"
                kode_racik:
                    type: string
                    description: Kode metode racikan (contoh PULV, CAPS)
                    example: "PULV"
                jumlah_racikan:
                    type: integer
                    description: Jumlah racikan
                    example: 10
                aturan_pakai:
                    type: string
                    description: Aturan pakai racikan
                    example: "3 x 1 bungkus"
                keterangan:
                    type: string
                    description: Keterangan tambahan
                    example: "Sebelum tidur"
                detail:
                    type: array
                    description: Komposisi bahan obat racikan
                    items:
                        $ref: "#/components/schemas/ResepRacikanDetailInput"
        ResepRacikanDetailInput:
            type: object
            required:
                - id_obat
                - jumlah
            properties:
                id_obat:
                    type: string
                    description: ID Obat
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
                kandungan:
                    type: string
                    description: Kandungan atau dosis obat
                    example: "500 mg"
                jumlah:
                    type: number
                    format: double
                    description: Jumlah bahan obat
                    example: 5.00
        AturanPakai:
            type: object
            properties:
                aturan_pakai:
                    type: string
                    example: "3 x 1 tablet sesudah makan"
        MetodeRacik:
            type: object
            properties:
                kode:
                    type: string
                    example: "PULV"
                nama:
                    type: string
                    example: "Puyer / Serbuk"
