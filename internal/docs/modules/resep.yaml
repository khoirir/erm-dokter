                "200":
                    description: Berhasil mengambil daftar metode racik
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar metode racik
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/MetodeRacik"
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/resep/{status_lanjut}/{id_kunjungan}:
        get:
            tags: [Resep]
            summary: Riwayat Resep per Kunjungan
            description: Mengambil riwayat peresepan obat pasien pada satu kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/ResepStatusLanjutSemua"
                - $ref: "#/components/parameters/ResepIdKunjungan"
                - $ref: "#/components/parameters/ResepTanggalFilter"
                - $ref: "#/components/parameters/ResepPageFilter"
                - $ref: "#/components/parameters/ResepLimitFilter"
            responses:
                "200":
                    description: Berhasil mengambil daftar resep
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar resep
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Resep"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Parameter permintaan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Status lanjut tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "404":
                    description: Data kunjungan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data registrasi kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        post:
            tags: [Resep]
            summary: Simpan Resep Obat Baru
            description: Menyimpan data resep obat baru untuk pasien rawat jalan maupun rawat inap.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/ResepStatusLanjut"
                - $ref: "#/components/parameters/ResepIdKunjungan"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanResepRequest"
            responses:
                "201":
                    description: Berhasil menyimpan resep obat
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan resep obat
                                    data:
                                        $ref: "#/components/schemas/Resep"
                "400":
                    description: Parameter atau data resep tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Pasien BPJS sudah bayar, resep tidak dapat disimpan
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Akses ditolak
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Peresepan obat melewati batas waktu maksimal 48 jam
                "404":
                    description: Data kunjungan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data registrasi kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
