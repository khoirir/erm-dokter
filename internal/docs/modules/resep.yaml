                                        example: Berhasil memperbarui resep obat
                                    data:
                                        $ref: "#/components/schemas/Resep"
                "400":
                    description: Parameter atau data resep tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
