paths:
    /api/v1/resep/aturan-pakai:
        get:
            tags: [Resep]
            summary: Daftar Master Aturan Pakai
            description: Mengambil daftar referensi aturan pakai obat untuk kebutuhan pencarian atau autocomplete.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/ResepKeywordFilter"
            responses:
                "200":
                    description: Berhasil mengambil daftar aturan pakai
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar aturan pakai
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/AturanPakai"
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/resep/metode-racik:
