paths:
    /api/v1/radiologi/{id_kunjungan}/{status_lanjut}:
        get:
            tags: [Radiologi]
            summary: Riwayat Hasil Radiologi per Kunjungan
            description: Mengambil seluruh riwayat hasil pemeriksaan radiologi dan link PACS DICOM pasien untuk 1 kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                  description: ID kunjungan terenkripsi
                - name: status_lanjut
                  in: path
                  required: true
                  schema:
                    type: string
                    enum: [Ralan, Ranap, Semua]
                  description: Status lanjut kunjungan
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 10
                - name: tanggal
                  in: query
                  schema:
                    type: string
                  description: Rentang tanggal pemeriksaan (YYYY-MM-DD,YYYY-MM-DD)
            responses:
                "200":
                    description: Berhasil mengambil riwayat hasil radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat hasil radiologi kunjungan
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/HasilRadiologi"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Parameter tidak valid
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
    /api/v1/radiologi/pasien/{id_pasien}/{status_lanjut}:
        get:
            tags: [Radiologi]
            summary: Riwayat Hasil Radiologi Pasien (Lintas Kunjungan)
            description: Mengambil riwayat hasil pemeriksaan radiologi dan link PACS pasien di seluruh kunjungan berdasarkan No. Rekam Medis.
            security:
                - BearerAuth: []
            parameters:
                - name: id_pasien
                  in: path
                  required: true
                  schema:
                    type: string
                  description: ID pasien terenkripsi
                - name: status_lanjut
                  in: path
                  required: true
                  schema:
                    type: string
                    enum: [Ralan, Ranap, Semua]
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 10
                - name: tanggal
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil mengambil riwayat hasil radiologi pasien
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat hasil radiologi pasien
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/HasilRadiologi"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Parameter tidak valid
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
    /api/v1/radiologi/{id_kunjungan}/{status_lanjut}/{id_radiologi}:
        get:
            tags: [Radiologi]
            summary: Detail Hasil Pemeriksaan Radiologi
            description: Mengambil detail 1 pemeriksaan radiologi, hasil teks ekspertise, dan daftar link gambar PACS DICOM.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                  description: ID kunjungan terenkripsi
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_radiologi
                  in: path
                  required: true
                  schema:
                    type: string
                  description: ID hasil radiologi terenkripsi (URL-safe token)
            responses:
                "200":
                    description: Berhasil mengambil detail hasil radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail hasil radiologi
                                    data:
                                        $ref: "#/components/schemas/HasilRadiologi"
                "400":
                    description: Parameter atau token tidak valid
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
                "404":
                    description: Data hasil pemeriksaan radiologi tidak ditemukan
    /api/v1/radiologi/permintaan/{id_kunjungan}/{status_lanjut}:
        post:
            tags: [Radiologi]
            summary: Simpan Permintaan Radiologi Baru
            description: Membuat order permintaan pemeriksaan radiologi baru untuk kunjungan rawat jalan atau rawat inap dengan proteksi batas waktu 48 jam dan kamar inap aktif.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanRadiologiRequest"
            responses:
                "201":
                    description: Berhasil menyimpan permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan permintaan radiologi
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "400":
                    description: Validasi input gagal atau tindakan radiologi tidak valid
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
                "403":
                    description: Melebihi batas waktu 48 jam rawat jalan
        get:
            tags: [Radiologi]
            summary: Daftar Permintaan Radiologi per Kunjungan
            description: Mengambil seluruh riwayat permintaan radiologi untuk satu kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter status pelayanan (Ralan, Ranap, Semua)
                  schema:
                    type: string
                    enum: [Ralan, Ranap, Semua]
                    example: Semua
            responses:
                "200":
                    description: Berhasil mengambil daftar permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar permintaan radiologi
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
    /api/v1/radiologi/pasien/{id_pasien}/permintaan/{status_lanjut}:
        get:
            tags: [Radiologi]
            summary: Riwayat Permintaan Radiologi Pasien by No. RM
            description: Mengambil riwayat seluruh permintaan radiologi pasien dari seluruh kunjungan sebelumnya dengan filter status pelayanan, rentang tanggal, dan paginasi.
            security:
                - BearerAuth: []
            parameters:
                - name: id_pasien
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter status pelayanan (Ralan, Ranap, Semua)
                  schema:
                    type: string
                    enum: [Ralan, Ranap, Semua]
                    example: Semua
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal YYYY-MM-DD,YYYY-MM-DD
                  schema:
                    type: string
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 5
            responses:
                "200":
                    description: Berhasil mengambil riwayat permintaan radiologi pasien
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat permintaan radiologi pasien
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/DetailPermintaanRadiologi"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
    /api/v1/radiologi/permintaan/{id_kunjungan}/{status_lanjut}/{id_permintaan}:
        get:
            tags: [Radiologi]
            summary: Detail Permintaan Radiologi
            description: Mengambil rincian lengkap 1 order permintaan radiologi beserta daftar item tindakannya.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_permintaan
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil mengambil detail permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail permintaan radiologi
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "400":
                    description: "Parameter status lanjut tidak valid (pilihan: Ralan, Ranap)"
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
                "404":
                    description: Permintaan radiologi tidak ditemukan
        put:
            tags: [Radiologi]
            summary: Perbarui Permintaan Radiologi
            description: Memperbarui order permintaan radiologi sebelum sampel/periksa dilakukan oleh petugas radiologi dan hanya dapat diperbarui oleh dokter pembuat order.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_permintaan
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanRadiologiRequest"
            responses:
                "200":
                    description: Berhasil memperbarui permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui permintaan radiologi
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "400":
                    description: Permintaan sudah diproses oleh petugas atau tindakan tidak valid
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
                "403":
                    description: Dilarang memperbarui order dokter lain atau melebihi batas waktu 48 jam
                "404":
                    description: Permintaan tidak ditemukan
        delete:
            tags: [Radiologi]
            summary: Batalkan Permintaan Radiologi
            description: Menghapus permintaan radiologi sebelum diproses petugas radiologi (tgl_sampel & tgl_hasil masih kosong) dan hanya dapat dibatalkan oleh dokter yang membuat order tersebut.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_permintaan
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil membatalkan permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil membatalkan permintaan radiologi
                "400":
                    description: Permintaan sudah diproses petugas radiologi
                "401":
                    description: Token JWT tidak valid atau kedaluwarsa
                "403":
                    description: Dilarang membatalkan order dokter lain
                "404":
                    description: Permintaan tidak ditemukan
components:
    schemas:
        ItemPemeriksaanRadiologiRequest:
            type: object
            required:
                - id_tindakan
            properties:
                id_tindakan:
                    type: string
                    description: Token terenkripsi ID tindakan radiologi
                    example: "tNd8xL..."
        SimpanPermintaanRadiologiRequest:
            type: object
            required:
                - no_rawat
                - tanggal_permintaan
                - jam_permintaan
                - diagnosa_klinis
                - pemeriksaan
            properties:
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan pasien
                    example: "2026/09/05/000001"
                tanggal_permintaan:
                    type: string
                    format: date
                    example: "2026-09-05"
                jam_permintaan:
                    type: string
                    example: "10:00:00"
                informasi_tambahan:
                    type: string
                    maxLength: 60
                    example: "Thorax AP"
                diagnosa_klinis:
                    type: string
                    maxLength: 80
                    example: "Susp. Pneumonia"
                pemeriksaan:
                    type: array
                    items:
                        $ref: "#/components/schemas/ItemPemeriksaanRadiologiRequest"
        PemeriksaanRadiologiItem:
            type: object
            properties:
                id_tindakan:
                    type: string
                    example: "tNd8xL..."
                kode_tindakan:
                    type: string
                    example: "RAD001"
                nama_tindakan:
                    type: string
                    example: "Rontgen Thorax AP/PA"
                biaya:
                    type: number
                    example: 125000
                status_bayar:
                    type: string
                    example: "Belum"
        DetailPermintaanRadiologi:
            type: object
            properties:
                id_permintaan:
                    type: string
                    example: "rAd9X2..."
                tanggal_permintaan:
                    type: string
                    example: "2026-09-05"
                jam_permintaan:
                    type: string
                    example: "10:00:00"
                tanggal_sampel:
                    type: string
                    example: "0000-00-00"
                jam_sampel:
                    type: string
                    example: "00:00:00"
                tanggal_hasil:
                    type: string
                    example: "0000-00-00"
                jam_hasil:
                    type: string
                    example: "00:00:00"
                dokter_perujuk:
                    type: object
                    properties:
                        kode_dokter:
                            type: string
                            example: "DR01"
                        nama_dokter:
                            type: string
                            example: "dr. Handi, Sp.Rad"
                status:
                    type: string
                    example: "Ralan"
                informasi_tambahan:
                    type: string
                    example: "Thorax AP"
                diagnosa_klinis:
                    type: string
                    example: "Susp. Pneumonia"
                pemeriksaan:
                    type: array
                    items:
                        $ref: "#/components/schemas/PemeriksaanRadiologiItem"
        HasilRadiologi:
            type: object
            properties:
                id:
                    type: string
                    description: Composite identifier hasil radiologi terenkripsi URL-safe (noRawat~kodeTindakan~tanggalPeriksa~jamPeriksa)
                    example: "hS8xP1..."
                id_kunjungan:
                    type: string
                    description: Identifier kunjungan terenkripsi URL-safe
                    example: "kR2mZ9..."
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan
                    example: "2026/04/22/000001"
                kode_tindakan:
                    type: string
                    description: Kode pemeriksaan radiologi
                    example: "RAD001"
                nama_tindakan:
                    type: string
                    description: Nama pemeriksaan radiologi
                    example: "Rontgen Thorax AP/PA"
                status:
                    type: string
                    description: Status pelayanan (Ralan / Ranap)
                    example: "Ralan"
                tanggal_periksa:
                    type: string
                    format: date
                    example: "2026-04-22"
                jam_periksa:
                    type: string
                    example: "10:00:00"
                dokter_perujuk:
                    type: object
                    properties:
                        kode_dokter:
                            type: string
                            example: "DR001"
                        nama_dokter:
                            type: string
                            example: "dr. Handi"
                dokter_radiologi:
                    type: object
                    properties:
                        kode_dokter:
                            type: string
                            example: "DR002"
                        nama_dokter:
                            type: string
                            example: "dr. Spesialis Radiologi, Sp.Rad"
                petugas:
                    type: object
                    properties:
                        nip:
                            type: string
                            example: "P001"
                        nama:
                            type: string
                            example: "Radiografer"
                hasil:
                    type: string
                    description: Teks bacaan / ekspertise hasil pemeriksaan radiologi
                    example: "Cor dan pulmo dalam batas normal. Tidak tampak infiltrat aktif."
                gambar_pacs:
                    type: array
                    items:
                        type: string
                    description: Daftar URL viewer PACS DICOM pasien
                    example: ["http://pacs.rsudkarsahusadabatu.com/explore_v5.asp?token=xyz..."]
