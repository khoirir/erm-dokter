    /api/v1/radiologi/permintaan/{status_lanjut}/{id_kunjungan}/{id_permintaan}:
        put:
            tags: [Radiologi]
            summary: Perbarui Permintaan Radiologi
            description: Memperbarui order permintaan radiologi sebelum sampel/periksa dilakukan oleh petugas radiologi dan hanya dapat diperbarui oleh dokter pembuat order.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/RadiologiStatusLanjut"
                - $ref: "#/components/parameters/RadiologiIdKunjungan"
                - $ref: "#/components/parameters/RadiologiIdPermintaan"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanRadiologiRequest"
            responses:
                "200":
                    description: Berhasil memperbarui permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui permintaan radiologi
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "400":
                    description: Format payload tidak valid, nomor rawat tidak cocok, atau pasien BPJS sudah bayar
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Nomor rawat permintaan radiologi tidak sesuai dengan ID kunjungan
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Dilarang mengubah order dokter lain, sudah diproses petugas, sudah dibayar, atau melebihi 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Permintaan radiologi dokter lain tidak dapat diubah
                "404":
                    description: Permintaan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data permintaan radiologi tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        delete:
            tags: [Radiologi]
            summary: Batalkan Permintaan Radiologi
            description: Menghapus order permintaan radiologi sebelum sampel/periksa dilakukan dan hanya dapat dibatalkan oleh dokter yang membuat order tersebut.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/RadiologiStatusLanjut"
                - $ref: "#/components/parameters/RadiologiIdKunjungan"
                - $ref: "#/components/parameters/RadiologiIdPermintaan"
            responses:
                "200":
                    description: Berhasil membatalkan permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil membatalkan permintaan radiologi
                "400":
                    description: Status lanjut atau ID tidak valid, atau pasien BPJS sudah bayar
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Pasien BPJS sudah bayar, permintaan radiologi tidak dapat dihapus
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Dilarang membatalkan order dokter lain, sudah diproses petugas, sudah dibayar, atau melebihi 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Permintaan radiologi dokter lain tidak dapat dihapus
                "404":
                    description: Permintaan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data permintaan radiologi tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
components:
    parameters:
        RadiologiStatusLanjutSemua:
            name: status_lanjut
            in: path
            required: true
            description: Status pelayanan kunjungan (semua, ralan, ranap)
            schema:
                type: string
                enum: [semua, ralan, ranap]
                example: ralan
        RadiologiStatusLanjut:
            name: status_lanjut
            in: path
            required: true
            description: Status pelayanan kunjungan (ralan, ranap)
            schema:
                type: string
                enum: [ralan, ranap]
                example: ralan
        RadiologiIdKunjungan:
            name: id_kunjungan
            in: path
            required: true
            description: Identifier kunjungan pasien terenkripsi URL-safe
            schema:
                type: string
        RadiologiIdPasien:
            name: id_pasien
            in: path
            required: true
            description: Identifier pasien (nomor rekam medis) terenkripsi URL-safe
            schema:
                type: string
        RadiologiIdRadiologi:
            name: id_radiologi
            in: path
            required: true
            description: ID hasil pemeriksaan radiologi composite terenkripsi URL-safe
            schema:
                type: string
        RadiologiIdPermintaan:
            name: id_permintaan
            in: path
            required: true
            description: Identifier nomor order permintaan radiologi terenkripsi URL-safe
            schema:
                type: string
        RadiologiTanggalFilter:
            name: tanggal
            in: query
            required: false
            description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD atau YYYY-MM-DD)
            schema:
                type: string
                example: "2026-08-01,2026-08-27"
        RadiologiPageFilter:
            name: page
            in: query
            required: false
            schema:
                type: integer
                default: 1
        RadiologiLimitFilter:
            name: limit
            in: query
            required: false
            schema:
                type: integer
                default: 5
    schemas:
        DokterInfo:
            type: object
            properties:
                kode_dokter:
                    type: string
                    example: "DR001"
                nama_dokter:
                    type: string
                    example: "dr. Handi, Sp.Rad"
        PetugasInfo:
            type: object
            properties:
                nip:
                    type: string
                    example: "P001"
                nama:
                    type: string
                    example: "Radiografer"
        ItemPemeriksaanRadiologiRequest:
            type: object
            required:
                - id_tindakan
            properties:
                id_tindakan:
                    type: string
                    description: Identifier tindakan radiologi terenkripsi URL-safe
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
        SimpanPermintaanRadiologiRequest:
            type: object
            required:
                - no_rawat
                - tanggal_permintaan
                - jam_permintaan
                - pemeriksaan
            properties:
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan pasien
                    example: "2026/09/05/000001"
                tanggal_permintaan:
                    type: string
                    description: Tanggal order permintaan (YYYY-MM-DD)
                    example: "2026-09-05"
                jam_permintaan:
                    type: string
                    description: Jam order permintaan (HH:mm:ss)
                    example: "10:00:00"
                informasi_tambahan:
                    type: string
                    maxLength: 60
                    description: Informasi klinis tambahan (maksimal 60 karakter, default '-')
                    example: "Thorax AP"
                diagnosa_klinis:
                    type: string
                    maxLength: 80
                    description: Indikasi atau dugaan diagnosa klinis (maksimal 80 karakter, default '-')
                    example: "Susp. Pneumonia"
                pemeriksaan:
                    type: array
                    description: Daftar tindakan pemeriksaan radiologi yang diminta
                    items:
                        $ref: "#/components/schemas/ItemPemeriksaanRadiologiRequest"
        PemeriksaanRadiologiItem:
            type: object
            properties:
                id_tindakan:
                    type: string
                    description: Identifier tindakan radiologi terenkripsi URL-safe
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
                kode_tindakan:
                    type: string
                    description: Kode master tindakan radiologi di SIMRS Khanza
                    example: "RAD001"
                nama_tindakan:
                    type: string
                    description: Nama tindakan pemeriksaan radiologi
                    example: "Rontgen Thorax AP/PA"
                biaya:
                    type: number
                    description: Tarif biaya pemeriksaan
                    example: 125000
                status_bayar:
                    type: string
                    description: Status bayar kasir SIMRS Khanza (Sudah / Belum)
                    example: "Belum"
        DetailPermintaanRadiologi:
            type: object
            properties:
                id_permintaan:
                    type: string
                    description: Identifier permintaan radiologi terenkripsi URL-safe
                    example: "rAd9X2..."
                tanggal_permintaan:
                    type: string
                    example: "2026-09-05"
                jam_permintaan:
                    type: string
                    example: "10:00:00"
                tanggal_sampel:
                    type: string
                    example: "0000-00-00"
                jam_sampel:
                    type: string
                    example: "00:00:00"
                tanggal_hasil:
                    type: string
                    example: "0000-00-00"
                jam_hasil:
                    type: string
                    example: "00:00:00"
                dokter_perujuk:
                    $ref: "#/components/schemas/DokterInfo"
                status:
                    type: string
                    description: Status pelayanan (Ralan / Ranap)
                    example: "Ralan"
                informasi_tambahan:
                    type: string
                    example: "Thorax AP"
                diagnosa_klinis:
                    type: string
                    example: "Susp. Pneumonia"
                pemeriksaan:
                    type: array
                    items:
                        $ref: "#/components/schemas/PemeriksaanRadiologiItem"
        HasilRadiologi:
            type: object
            properties:
                id:
                    type: string
                    description: Composite identifier hasil radiologi terenkripsi URL-safe (noRawat~kodeTindakan~tanggalPeriksa~jamPeriksa)
                    example: "hS8xP1..."
                id_kunjungan:
                    type: string
                    description: Identifier kunjungan terenkripsi URL-safe
                    example: "kR2mZ9..."
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan
                    example: "2026/04/22/000001"
                kode_tindakan:
                    type: string
                    description: Kode master tindakan radiologi
                    example: "RAD001"
                nama_tindakan:
                    type: string
                    description: Nama pemeriksaan radiologi
                    example: "Rontgen Thorax AP/PA"
                status:
                    type: string
                    description: Status pelayanan (Ralan / Ranap)
                    example: "Ralan"
                tanggal_periksa:
                    type: string
                    format: date
                    example: "2026-04-22"
                jam_periksa:
                    type: string
                    example: "10:00:00"
                dokter_perujuk:
                    $ref: "#/components/schemas/DokterInfo"
                dokter_radiologi:
                    $ref: "#/components/schemas/DokterInfo"
                petugas:
                    $ref: "#/components/schemas/PetugasInfo"
                hasil:
                    type: string
                    description: Teks bacaan atau ekspertise hasil pemeriksaan radiologi
                    example: "Cor dan pulmo dalam batas normal. Tidak tampak infiltrat aktif."
                gambar_pacs:
                    type: array
                    items:
                        type: string
                    description: Daftar URL viewer PACS DICOM pasien
                    example: ["http://pacs.rsudkarsahusadabatu.com/explore_v5.asp?token=xyz..."]
