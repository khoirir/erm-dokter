                                        $ref: "#/components/schemas/HasilRadiologi"
                "400":
                    description: Parameter atau token tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID hasil radiologi tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "404":
                    description: Data hasil pemeriksaan radiologi tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data hasil pemeriksaan radiologi tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/radiologi/permintaan/{status_lanjut}/{id_kunjungan}:
        post:
            tags: [Radiologi]
            summary: Simpan Permintaan Radiologi Baru
            description: Membuat order permintaan pemeriksaan radiologi baru untuk kunjungan rawat jalan atau rawat inap dengan proteksi batas waktu 48 jam dan kamar inap aktif.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/RadiologiStatusLanjut"
                - $ref: "#/components/parameters/RadiologiIdKunjungan"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanRadiologiRequest"
            responses:
                "201":
                    description: Berhasil menyimpan permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan permintaan radiologi
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "400":
                    description: Validasi input gagal, BPJS sudah bayar, atau ranap tidak aktif
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Pasien BPJS sudah bayar, permintaan radiologi tidak dapat disimpan
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Melebihi batas waktu 48 jam rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Permintaan radiologi tidak dapat disimpan, melewati batas 48 jam
                "404":
                    description: Data registrasi kunjungan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data registrasi kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        get:
            tags: [Radiologi]
            summary: Daftar Permintaan Radiologi per Kunjungan
            description: Mengambil seluruh riwayat permintaan radiologi untuk satu kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/RadiologiStatusLanjutSemua"
                - $ref: "#/components/parameters/RadiologiIdKunjungan"
            responses:
                "200":
                    description: Berhasil mengambil daftar permintaan radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar permintaan radiologi
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/DetailPermintaanRadiologi"
                "400":
                    description: Status lanjut atau ID kunjungan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Status lanjut tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
