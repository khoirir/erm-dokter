paths:
    /api/v1/radiologi/hasil/{status_lanjut}/{id_kunjungan}:
        get:
            tags: [Radiologi]
            summary: Riwayat Hasil Radiologi per Kunjungan
            description: Mengambil seluruh riwayat hasil pemeriksaan radiologi dan link PACS DICOM pasien untuk 1 kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/RadiologiStatusLanjutSemua"
                - $ref: "#/components/parameters/RadiologiIdKunjungan"
                - $ref: "#/components/parameters/RadiologiTanggalFilter"
                - $ref: "#/components/parameters/RadiologiPageFilter"
                - $ref: "#/components/parameters/RadiologiLimitFilter"
            responses:
                "200":
                    description: Berhasil mengambil riwayat hasil radiologi
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat hasil radiologi kunjungan
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/HasilRadiologi"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Status lanjut atau ID kunjungan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Status lanjut tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/radiologi/hasil/{status_lanjut}/pasien/{id_pasien}:
