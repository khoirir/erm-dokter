    /api/v1/laboratorium/pk/permintaan/{status_lanjut}/{id_kunjungan}/{id_permintaan}:
        put:
            tags: [Laboratorium]
            summary: Perbarui Permintaan Laboratorium PK
            description: Memperbarui order permintaan laboratorium PK sebelum sampel diambil oleh petugas laboratorium dan hanya dapat diperbarui oleh dokter pembuat order.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabStatusLanjut"
                - $ref: "#/components/parameters/LabIdKunjungan"
                - $ref: "#/components/parameters/LabIdPermintaan"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanLabPKRequest"
            responses:
                "200":
                    description: Berhasil memperbarui permintaan laboratorium PK
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui permintaan laboratorium PK
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanLabPK"
                "400":
                    description: Format payload tidak valid, nomor rawat tidak cocok, atau pasien BPJS sudah bayar
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Nomor rawat permintaan laboratorium tidak sesuai dengan ID kunjungan
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Dilarang mengubah order dokter lain, sudah diproses petugas, atau melebihi 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Permintaan laboratorium dokter lain tidak dapat diubah
                "404":
                    description: Permintaan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data permintaan laboratorium tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        delete:
            tags: [Laboratorium]
            summary: Batalkan Permintaan Laboratorium PK
            description: Menghapus order permintaan laboratorium PK sebelum sampel diambil oleh petugas laboratorium dan hanya dapat dibatalkan oleh dokter yang membuat order tersebut.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabStatusLanjut"
                - $ref: "#/components/parameters/LabIdKunjungan"
                - $ref: "#/components/parameters/LabIdPermintaan"
            responses:
                "200":
                    description: Berhasil membatalkan permintaan laboratorium PK
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil membatalkan permintaan laboratorium PK
                "400":
                    description: Status lanjut atau ID tidak valid, atau pasien BPJS sudah bayar
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Status lanjut tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Dilarang membatalkan order dokter lain, sudah diproses petugas, atau melebihi 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Permintaan laboratorium dokter lain tidak dapat dihapus
                "404":
                    description: Permintaan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data permintaan laboratorium tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
