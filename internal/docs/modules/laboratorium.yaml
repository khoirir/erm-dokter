components:
    parameters:
        LabKategori:
            name: kategori
            in: path
            required: true
            description: Kategori laboratorium (PK = Patologi Klinik, PA = Patologi Anatomi, MB = Mikrobiologi)
            schema:
                type: string
                enum: [PK, PA, MB]
                example: PK
        LabStatusLanjutSemua:
            name: status_lanjut
            in: path
            required: true
            description: Status pelayanan kunjungan (semua, ralan, ranap)
            schema:
                type: string
                enum: [semua, ralan, ranap]
                example: ralan
        LabStatusLanjut:
            name: status_lanjut
            in: path
            required: true
            description: Status pelayanan kunjungan (ralan, ranap)
            schema:
                type: string
                enum: [ralan, ranap]
                example: ralan
        LabIdKunjungan:
            name: id_kunjungan
            in: path
            required: true
            description: Identifier kunjungan pasien terenkripsi URL-safe
            schema:
                type: string
        LabIdPasien:
            name: id_pasien
            in: path
            required: true
            description: Identifier pasien (nomor rekam medis) terenkripsi URL-safe
            schema:
                type: string
        LabIdHasil:
            name: id_hasil
            in: path
            required: true
            description: Composite identifier hasil pemeriksaan laboratorium terenkripsi URL-safe (noRawat~kodeTindakan~tanggalPeriksa~jamPeriksa)
            schema:
                type: string
        LabIdPermintaan:
            name: id_permintaan
            in: path
            required: true
            description: Identifier nomor order permintaan laboratorium terenkripsi URL-safe
            schema:
                type: string
        LabTanggalFilter:
            name: tanggal
            in: query
            required: false
            description: Filter rentang tanggal (YYYY-MM-DD,YYYY-MM-DD atau YYYY-MM-DD)
            schema:
                type: string
                example: "2026-09-01,2026-09-30"
        LabPageFilter:
            name: page
            in: query
            required: false
            schema:
                type: integer
                default: 1
        LabLimitFilter:
            name: limit
            in: query
            required: false
            schema:
                type: integer
                default: 5
    schemas:
        DokterInfo:
            type: object
            properties:
                kode_dokter:
                    type: string
                    example: "DR001"
                nama_dokter:
                    type: string
                    example: "dr. Budi, Sp.PK"
        PetugasInfo:
            type: object
            properties:
                nip:
                    type: string
                    example: "P001"
                nama:
                    type: string
                    example: "Siti Analis"
        ItemPemeriksaanLabPKRequest:
            type: object
            required:
                - id_tindakan
            properties:
                id_tindakan:
                    type: string
                    description: Identifier tindakan laboratorium PK terenkripsi URL-safe
                    example: "cEHMe-_JrJhDixVUHb0x3VBd8JblVj6FJ8EHaKiZX05gOuGYm7SBxLka84U_"
                id_template:
                    type: array
                    description: Daftar identifier sub-template pengujian terenkripsi (opsional, pilih parameter spesifik)
                    items:
                        type: string
                    example: ["j7Nx1...", "b3K9m..."]
        SimpanPermintaanLabPKRequest:
            type: object
            required:
                - no_rawat
                - tanggal_permintaan
                - jam_permintaan
                - diagnosa_klinis
                - pemeriksaan
            properties:
                no_rawat:
                    type: string
                    description: Nomor rawat kunjungan pasien
                    example: "2026/09/03/000001"
                tanggal_permintaan:
                    type: string
                    description: Tanggal order permintaan (YYYY-MM-DD)
                    example: "2026-09-03"
                jam_permintaan:
                    type: string
                    description: Jam order permintaan (HH:mm:ss)
                    example: "10:00:00"
                diagnosa_klinis:
                    type: string
                    maxLength: 80
                    description: Diagnosa klinis / indikasi pemeriksaan
                    example: "Febris H-3 suspect DHF"
                informasi_tambahan:
                    type: string
                    maxLength: 60
                    description: Informasi tambahan / catatan klinis untuk analis lab (default '-')
                    example: "Cito segera"
                pemeriksaan:
                    type: array
                    description: Daftar tindakan lab dan sub-template pengujian yang dipesan
                    items:
                        $ref: "#/components/schemas/ItemPemeriksaanLabPKRequest"
        DetailTemplateLabPKItem:
            type: object
            properties:
                id_template:
                    type: string
                    description: Identifier template pengujian terenkripsi URL-safe
                    example: "j7Nx1..."
                nama_pemeriksaan:
                    type: string
                    example: "Hemoglobin"
                satuan:
                    type: string
                    example: "g/dL"
                nilai_rujukan:
                    type: string
                    example: "12-16"
                status_bayar:
                    type: string
                    example: "Belum"
        PemeriksaanLabPKItem:
            type: object
            properties:
                id_tindakan:
                    type: string
                    description: Identifier tindakan laboratorium PK terenkripsi URL-safe
