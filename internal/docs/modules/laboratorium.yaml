                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter status pelayanan (Ralan, Ranap, Semua)
                  schema:
                    type: string
                    enum: [Ralan, Ranap, Semua]
                    example: Semua
            responses:
                "200":
                    description: Berhasil mengambil daftar permintaan laboratorium MB
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/PermintaanLabMB"
    /api/v1/laboratorium/mb/permintaan/pasien/{id_pasien}/{status_lanjut}:
        get:
            summary: Riwayat Permintaan Laboratorium MB Pasien by No. RM
            description: Mengambil riwayat seluruh permintaan laboratorium MB pasien dari seluruh kunjungan sebelumnya dengan filter status pelayanan, rentang tanggal, dan paginasi.
            tags:
                - Laboratorium
            security:
                - BearerAuth: []
            parameters:
                - name: id_pasien
                  in: path
                  required: true
                  description: Token URL pasien terenkripsi
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Filter status pelayanan (Ralan, Ranap, Semua)
                  schema:
                    type: string
                    enum: [Ralan, Ranap, Semua]
                    example: Semua
                - name: tanggal
                  in: query
                  description: Filter rentang tanggal YYYY-MM-DD,YYYY-MM-DD
                  schema:
                    type: string
                - name: page
                  in: query
                  schema:
                    type: integer
                    default: 1
                - name: limit
                  in: query
                  schema:
                    type: integer
                    default: 5
            responses:
                "200":
                    description: Berhasil mengambil riwayat permintaan laboratorium MB pasien
    /api/v1/laboratorium/mb/permintaan/{id_kunjungan}/{status_lanjut}/{id_permintaan}:
        get:
            summary: Detail Permintaan Laboratorium MB
            description: Mengambil rincian lengkap permintaan laboratorium MB beserta item tindakan dan sub-template pengujian yang dipilih dokter.
            tags:
                - Laboratorium
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_permintaan
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil mengambil detail permintaan laboratorium MB
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanLabMB"
                "404":
                    description: Permintaan tidak ditemukan
        put:
            summary: Update / Edit Permintaan Laboratorium MB
            description: |
                Memperbarui data dan daftar pemeriksaan laboratorium MB (Mikrobiologi) yang telah dikirimkan oleh dokter dengan nomor permintaan yang tetap.

                ### Aturan Bisnis & Validasi:
                - **Dokter Pembuat**: Hanya dokter yang membuat permintaan (`kd_dokter_perujuk == claims.KodeDokter`) yang berhak memperbarui.
                - **Proteksi Analis Lab**: Permintaan yang sampelnya sudah diambil (`tgl_sampel != 0000-00-00`) atau sudah selesai keluar hasil (`tgl_hasil != 0000-00-00`) **terkunci permanen dan ditolak**.
                - **Proteksi 48 Jam (Rawat Jalan)**: Batas waktu pengeditan maksimal 48 jam dari waktu registrasi pasien.
                - **Validasi Ranap**: Pasien rawat inap tidak boleh sudah checkout/keluar.
                - **Atomisitas Transaksi**: Header permintaan MB diupdate dan detail pemeriksaan lab (beserta template pengujian) diganti secara atomik dalam 1 transaksi DB.
            tags:
                - Laboratorium
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_permintaan
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanLabMBRequest"
            responses:
                "200":
                    description: Berhasil memperbarui permintaan laboratorium MB
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui permintaan laboratorium MB
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanLabMB"
                "400":
                    description: Validasi input gagal atau permintaan telah diproses analis lab
                "403":
                    description: Dilarang memperbarui order dokter lain atau melebihi batas waktu 48 jam
                "404":
                    description: Permintaan tidak ditemukan
        delete:
            summary: Batalkan Permintaan Laboratorium MB
            description: Menghapus permintaan laboratorium MB sebelum sampel diambil oleh petugas laboratorium (proteksi tgl_sampel & tgl_hasil belum terisi) dan hanya dapat dibatalkan oleh dokter yang mengirimkan order tersebut.
            tags:
                - Laboratorium
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  schema:
                    type: string
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status pelayanan (Ralan, Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ralan
                - name: id_permintaan
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil membatalkan permintaan laboratorium MB
                "400":
                    description: Permintaan sudah diproses laboratorium
                "403":
                    description: Dilarang membatalkan order dokter lain
                "404":
                    description: Permintaan tidak ditemukan
