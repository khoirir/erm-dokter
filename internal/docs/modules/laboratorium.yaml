paths:
    /api/v1/laboratorium/{kategori}/hasil/{status_lanjut}/{id_kunjungan}:
        get:
            tags: [Laboratorium]
            summary: Riwayat Hasil Laboratorium per Kunjungan
            description: Mengambil riwayat hasil pemeriksaan laboratorium pada 1 kunjungan pasien berdasarkan kategori (PK, PA, MB) dan status lanjut (Semua, Ralan, Ranap).
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabKategori"
                - $ref: "#/components/parameters/LabStatusLanjutSemua"
                - $ref: "#/components/parameters/LabIdKunjungan"
                - $ref: "#/components/parameters/LabTanggalFilter"
                - $ref: "#/components/parameters/LabPageFilter"
                - $ref: "#/components/parameters/LabLimitFilter"
            responses:
                "200":
                    description: Berhasil mengambil riwayat hasil laboratorium
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat hasil laboratorium
                                    data:
                                        $ref: "#/components/schemas/HasilLaboratoriumKunjungan"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Kategori, status lanjut, atau ID kunjungan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: "Kategori laboratorium tidak valid (pilihan: PK, PA, MB)"
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/laboratorium/{kategori}/hasil/{status_lanjut}/pasien/{id_pasien}:
        get:
            tags: [Laboratorium]
            summary: Riwayat Hasil Laboratorium Pasien (Semua Kunjungan by RM)
            description: Mengambil riwayat hasil pemeriksaan laboratorium seluruh kunjungan pasien berdasarkan No RM, kategori, dan status pelayanan.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabKategori"
                - $ref: "#/components/parameters/LabStatusLanjutSemua"
                - $ref: "#/components/parameters/LabIdPasien"
                - $ref: "#/components/parameters/LabTanggalFilter"
                - $ref: "#/components/parameters/LabPageFilter"
                - $ref: "#/components/parameters/LabLimitFilter"
            responses:
                "200":
                    description: Berhasil mengambil riwayat hasil laboratorium pasien
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat hasil laboratorium pasien
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/HasilLaboratorium"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Kategori, status lanjut, atau ID pasien tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID pasien tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/laboratorium/{kategori}/hasil/{status_lanjut}/{id_kunjungan}/{id_hasil}:
        get:
            tags: [Laboratorium]
            summary: Detail Hasil Pemeriksaan Laboratorium
            description: Mengambil detail 1 pemeriksaan laboratorium beserta hasil lab PK (parameter pengujian) dan/atau PA (makroskopis, mikroskopis, kesimpulan) menggunakan composite identifier terenkripsi.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabKategori"
                - $ref: "#/components/parameters/LabStatusLanjut"
                - $ref: "#/components/parameters/LabIdKunjungan"
                - $ref: "#/components/parameters/LabIdHasil"
            responses:
                "200":
                    description: Berhasil mengambil detail hasil laboratorium
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail hasil laboratorium
                                    data:
                                        $ref: "#/components/schemas/HasilLaboratorium"
                "400":
                    description: Parameter atau token tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID hasil laboratorium tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "404":
                    description: Data hasil pemeriksaan laboratorium tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data hasil pemeriksaan laboratorium tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    # ═══════════════════════════════════════════════════════════════════════
    # Permintaan Laboratorium PK (Patologi Klinik)
    # ═══════════════════════════════════════════════════════════════════════
    /api/v1/laboratorium/pk/permintaan/{status_lanjut}/{id_kunjungan}:
        post:
            tags: [Laboratorium]
            summary: Simpan Permintaan Laboratorium PK Baru
            description: Membuat order permintaan pemeriksaan laboratorium Patologi Klinik (PK) baru untuk kunjungan rawat jalan atau rawat inap dengan proteksi batas waktu 48 jam dan kamar inap aktif.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabStatusLanjut"
                - $ref: "#/components/parameters/LabIdKunjungan"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPermintaanLabPKRequest"
            responses:
                "201":
                    description: Berhasil mengirim permintaan laboratorium PK
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengirim permintaan laboratorium PK
                                    data:
                                        $ref: "#/components/schemas/DetailPermintaanLabPK"
                "400":
                    description: Validasi input gagal, BPJS sudah bayar, atau ranap tidak aktif
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Nomor rawat permintaan laboratorium tidak sesuai dengan ID kunjungan
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Melebihi batas waktu 48 jam rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Permintaan laboratorium tidak dapat disimpan, melewati batas 48 jam
                "404":
                    description: Data registrasi kunjungan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data registrasi kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        get:
            tags: [Laboratorium]
            summary: Daftar Permintaan Laboratorium PK per Kunjungan
            description: Mengambil seluruh riwayat permintaan laboratorium PK untuk satu kunjungan tertentu.
            security:
                - BearerAuth: []
            parameters:
                - $ref: "#/components/parameters/LabStatusLanjutSemua"
                - $ref: "#/components/parameters/LabIdKunjungan"
            responses:
                "200":
                    description: Berhasil mengambil daftar permintaan laboratorium PK
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar permintaan laboratorium PK
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/PermintaanLabPK"
                "400":
                    description: Status lanjut atau ID kunjungan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Status lanjut tidak valid
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
