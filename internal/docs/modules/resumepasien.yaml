paths:
    # ==================== RESUME RAWAT JALAN (RALAN) ====================
    /api/v1/resume/ralan/referensi:
        get:
            tags: [Resume Rawat Jalan]
            summary: Daftar Referensi Opsi Pilihan Resume Pasien Rawat Jalan
            description: Mengambil opsi referensi dropdown `keadaan_pulang` (Hidup, Meninggal) untuk formulir resume medis rawat jalan pasien.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil data referensi resume ralan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil opsi referensi resume ralan
                                    data:
                                        $ref: "#/components/schemas/ReferensiResumeRalanResponse"
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server

    /api/v1/resume/ralan/{id_kunjungan}:
        get:
            tags: [Resume Rawat Jalan]
            summary: Detail Resume Medis Rawat Jalan per Kunjungan
            description: Mengambil rincian data resume medis rawat jalan pasien (tabel `resume_pasien`) berdasarkan token terenkripsi nomor rawat kunjungan (`id_kunjungan`).
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                      example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5" 
            responses:
                "200":
                    description: Berhasil mengambil detail resume pasien rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail resume pasien rawat jalan
                                    data:
                                        $ref: "#/components/schemas/ResumePasienRalan"
                "400":
                    description: Validasi data gagal atau token ID tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID kunjungan tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "404":
                    description: Data tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data resume pasien rawat jalan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        post:
            tags: [Resume Rawat Jalan]
            summary: Simpan Resume Medis Rawat Jalan Baru
            description: |
                Menyimpan catatan resume medis pasien rawat jalan baru.

                ### Aturan Bisnis & Validasi:
                - **Isolasi Rawat Jalan**: Pasien yang sudah terdaftar di rawat inap ditolak. Resume medis rawat jalan hanya untuk kunjungan rawat jalan.
                - **Batas Waktu Relatif 48 Jam**: Pembuatan resume medis ditolak jika waktu sekarang telah melampaui batas 48 jam sejak waktu registrasi kunjungan poliklinik.
                - **Integritas Entitas Induk**: Nilai `no_rawat` pada request body wajib cocok dengan ID kunjungan pada parameter URL.
                - **Satu Resume per Kunjungan**: Jika sudah ada resume pada kunjungan tersebut, sistem mengembalikan error 400 (duplikasi data).
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                      example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5" 
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanResumePasienRalanRequest"
            responses:
                "201":
                    description: Berhasil menyimpan resume pasien rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan resume pasien rawat jalan
                                    data:
                                        $ref: "#/components/schemas/ResumePasienRalan"
                "400":
                    description: Validasi data gagal atau token ID tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Resume medis rawat jalan untuk kunjungan ini sudah ada
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Akses ditolak karena bukan dokter pembuat atau melewati batas waktu
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Resume pasien rawat jalan tidak dapat disimpan, melewati batas 48 jam
                "404":
                    description: Data tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        put:
            tags: [Resume Rawat Jalan]
            summary: Update Resume Medis Rawat Jalan
            description: |
                Memperbarui catatan resume medis pasien rawat jalan yang telah dibuat sebelumnya.

                ### Aturan Bisnis & Validasi:
                - **Proteksi Kepemilikan Dokter Pembuat (403 Forbidden)**: Hanya dokter yang membuat resume awal yang berhak melakukan pembaruan data.
                - **Proteksi Batas Waktu 48 Jam**: Pembaruan ditolak jika kunjungan rawat jalan telah melewati batas waktu 48 jam sejak waktu registrasi.
                - **Isolasi Rawat Jalan**: Pasien yang sudah terdaftar di rawat inap ditolak.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                      example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5" 
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateResumePasienRalanRequest"
            responses:
                "200":
                    description: Berhasil memperbarui resume pasien rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui resume pasien rawat jalan
                                    data:
                                        $ref: "#/components/schemas/ResumePasienRalan"
                "400":
                    description: Validasi data gagal atau token ID tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Format data resume tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Akses ditolak karena bukan dokter pembuat atau melewati batas waktu
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Resume pasien dokter lain tidak dapat diubah
                "404":
                    description: Data tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data resume pasien rawat jalan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        delete:
            tags: [Resume Rawat Jalan]
            summary: Hapus Resume Medis Rawat Jalan
            description: |
                Menghapus catatan resume medis rawat jalan pasien.

                ### Aturan Bisnis & Validasi:
                - **Proteksi Kepemilikan Dokter Pembuat (403 Forbidden)**: Hanya dokter pembuat yang berhak menghapus resume.
                - **Proteksi Batas Waktu 48 Jam**: Penghapusan ditolak jika kunjungan ralan telah melewati batas waktu 48 jam sejak waktu registrasi.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                      type: string
                      example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5" 
            responses:
                "200":
                    description: Berhasil menghapus resume pasien rawat jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menghapus resume pasien rawat jalan
                "400":
                    description: Validasi data gagal atau token ID tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID kunjungan tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Akses ditolak karena bukan dokter pembuat atau melewati batas waktu
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Resume pasien dokter lain tidak dapat dihapus
                "404":
                    description: Data tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data resume pasien rawat jalan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server

