                    example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5"
                no_rawat:
                    type: string
                    example: "2026/09/07/000001"
                kode_dokter:
                    type: string
                    example: "DR001"
                nama_dokter:
                    type: string
                    example: "dr. Handi Pratama, Sp.A"
                keluhan_utama:
                    type: string
                    example: "Batuk pilek sejak 3 hari yang lalu disertai demam ringan"
                jalannya_penyakit:
                    type: string
                    example: "Pasien mengeluhkan demam naik turun, batuk berdahak, nafsu makan menurun"
                pemeriksaan_fisik:
                    type: string
                    example: "KU sedang, compos mentis, TTV: TD 110/70, N 88, S 37.8, RR 20"
                pemeriksaan_penunjang:
                    type: string
                    example: "Lab Darah Lengkap: Hb 13.2, Leukosit 11.200, Trombosit 245.000"
