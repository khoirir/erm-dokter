paths:
    /api/v1/resume/referensi/{status_lanjut}:
        get:
            tags: [Resume]
            summary: Daftar Referensi Opsi Pilihan Resume Pasien
            description: |
                Mengambil opsi pilihan dropdown untuk form resume pasien sesuai dengan status lanjut (`Ralan` atau `Ranap`).
                - **Ralan**: Mengembalikan opsi `kondisi_pulang` (Hidup, Meninggal).
                - **Ranap**: Mengembalikan opsi `cara_keluar`, `keadaan_pulang`, dan `dilanjutkan`.
            security:
                - BearerAuth: []
            parameters:
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut pelayanan
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ranap
            responses:
                "200":
                    description: Berhasil mengambil data referensi resume pasien
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            oneOf:
                                                - $ref: "#/components/schemas/ReferensiResumeRalanResponse"
                                                - $ref: "#/components/schemas/ReferensiResumeRanapResponse"
                "400":
                    description: Status lanjut tidak valid (pilihan Ralan, Ranap)
                "401":
                    description: Token tidak ada atau kadaluarsa

    /api/v1/resume/{id_kunjungan}/{status_lanjut}:
        get:
            tags: [Resume]
            summary: Detail Resume Pasien per Kunjungan
            description: |
                Mengambil rincian data resume medis rawat jalan atau rawat inap pasien berdasarkan token terenkripsi nomor rawat kunjungan (`id_kunjungan`).
                - **Ralan**: Mengambil resume medis rawat jalan (tabel `resume_pasien`).
                - **Ranap**: Mengambil resume medis rawat inap (tabel `resume_pasien_ranap`) beserta informasi kamar dan tanggal masuk/keluar rawat inap.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
                    example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5"
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut kunjungan (Ralan atau Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ranap
            responses:
                "200":
                    description: Berhasil mengambil detail resume pasien
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            oneOf:
                                                - $ref: "#/components/schemas/ResumePasien"
                                                - $ref: "#/components/schemas/ResumePasienRanap"
                "400":
                    description: ID kunjungan tidak valid atau status lanjut tidak valid
                "401":
                    description: Token tidak ada atau kadaluarsa
                "404":
                    description: Resume pasien belum diisi / tidak ditemukan
        post:
            tags: [Resume]
            summary: Simpan Resume Pasien Baru
            description: |
                Menyimpan data resume medis pasien baru untuk kunjungan rawat jalan atau rawat inap.

                ### Aturan Bisnis & Validasi:
                - **Ralan**:
                  - Pasien yang sudah terdaftar di rawat inap ditolak.
                  - Pembuatan resume medis ditolak jika waktu sekarang telah melampaui batas 48 jam dari waktu registrasi kunjungan.
                - **Ranap**:
                  - Pasien wajib pernah terdaftar di kamar inap (`hasRecordKamar = true`).
                  - Dapat disimpan baik saat masih dirawat maupun setelah checkout pulang (*discharge summary*).
                - **Satu Resume per Kunjungan**: Jika sudah ada resume pada kunjungan tersebut, sistem mengembalikan error 400 (duplikasi data).
                - **Kode ICD Otomatis Default**: Dokter tidak perlu menginput kode ICD 10 dan ICD 9. Nilai akan otomatis diset default string kosong ke database.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
                    example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5"
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut kunjungan (Ralan atau Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ranap
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/SimpanResumePasienRequest"
                                - $ref: "#/components/schemas/SimpanResumePasienRanapRequest"
            responses:
                "201":
                    description: Berhasil menyimpan resume pasien
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            oneOf:
                                                - $ref: "#/components/schemas/ResumePasien"
                                                - $ref: "#/components/schemas/ResumePasienRanap"
                "400":
                    description: Validasi input gagal, ID tidak cocok, duplikasi resume, atau status rawat tidak memenuhi syarat
                "401":
                    description: Token tidak ada atau kadaluarsa
                "403":
                    description: Kunjungan rawat jalan telah melewati batas waktu 48 jam
                "404":
                    description: Kunjungan pasien tidak ditemukan
        put:
            tags: [Resume]
            summary: Update Resume Pasien
            description: |
                Memperbarui catatan resume medis pasien yang telah dibuat sebelumnya.

                ### Aturan Bisnis & Validasi:
                - **Proteksi Kepemilikan Dokter Pembuat (403 Forbidden)**: Hanya dokter yang membuat resume awal yang berhak melakukan pembaruan data.
                - **Proteksi Batas Waktu 48 Jam (Khusus Ralan)**: Pembaruan ditolak jika kunjungan rawat jalan telah melewati batas waktu 48 jam.
                - **Khusus Rawat Inap (Ranap)**: Pasien wajib memiliki rekam riwayat kamar inap.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
                    example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5"
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut kunjungan (Ralan atau Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ranap
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/UpdateResumePasienRequest"
                                - $ref: "#/components/schemas/UpdateResumePasienRanapRequest"
            responses:
                "200":
                    description: Berhasil memperbarui resume pasien
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            oneOf:
                                                - $ref: "#/components/schemas/ResumePasien"
                                                - $ref: "#/components/schemas/ResumePasienRanap"
                "400":
                    description: Validasi input gagal atau status rawat tidak sesuai
                "401":
                    description: Token tidak ada atau kadaluarsa
                "403":
                    description: Bukan dokter pembuat atau kunjungan ralan telah melewati batas 48 jam
                "404":
                    description: Resume pasien tidak ditemukan
        delete:
            tags: [Resume]
            summary: Hapus Resume Pasien
            description: |
                Menghapus catatan resume medis pasien.

                ### Aturan Bisnis & Validasi:
                - **Proteksi Kepemilikan Dokter Pembuat (403 Forbidden)**: Hanya dokter pembuat yang berhak menghapus resume.
                - **Proteksi Batas Waktu 48 Jam (Khusus Ralan)**: Penghapusan ditolak jika kunjungan ralan telah melewati batas 48 jam.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
                    example: "uLmCNtewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5"
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut kunjungan (Ralan atau Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ranap
            responses:
                "200":
                    description: Berhasil menghapus resume pasien
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "400":
                    description: ID kunjungan tidak valid atau status lanjut tidak valid
                "401":
                    description: Token tidak ada atau kadaluarsa
                "403":
                    description: Bukan dokter pembuat atau kunjungan ralan telah melewati batas 48 jam
                "404":
                    description: Resume pasien tidak ditemukan

    /api/v1/resume/pasien/{id_pasien}/{status_lanjut}:
        get:
            tags: [Resume]
            summary: Riwayat Resume Pasien Berdasarkan No. RM
            description: |
                Mengambil seluruh riwayat resume medis pasien berdasarkan token terenkripsi Nomor Rekam Medis (`id_pasien`) dan `status_lanjut` (`Ralan` atau `Ranap`).
            security:
                - BearerAuth: []
            parameters:
                - name: id_pasien
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rekam Medis Pasien
                  schema:
                    type: string
                    example: "e2LNmOiewkyBm2RkSXMbI0Ug066Nw-qzDqcst6KgJGV0grSwOYspdyzWtiWU5"
                - name: status_lanjut
                  in: path
                  required: true
                  description: Status lanjut kunjungan (Ralan atau Ranap)
                  schema:
                    type: string
                    enum: [Ralan, Ranap]
                    example: Ranap
            responses:
                "200":
                    description: Berhasil mengambil riwayat resume pasien
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                oneOf:
                                                    - $ref: "#/components/schemas/ResumePasien"
                                                    - $ref: "#/components/schemas/ResumePasienRanap"
                "400":
                    description: ID pasien tidak valid atau status lanjut tidak valid
                "401":
                    description: Token tidak ada atau kadaluarsa

