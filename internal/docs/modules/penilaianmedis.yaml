paths:
    /api/v1/penilaian-medis/referensi:
        get:
            summary: Daftar Opsi Dropdown Penilaian Medis
            description: Mengambil seluruh daftar opsi dropdown (anamnesis, keadaan umum, tingkat kesadaran, dan status pemeriksaan fisik) untuk formulir asesmen medis.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil opsi referensi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil opsi referensi penilaian medis
                                    data:
                                        $ref: "#/components/schemas/ReferensiPenilaianMedis"
    /api/v1/penilaian-medis/ralan/{id_kunjungan}:
        get:
            summary: Detail Penilaian Awal Medis Rawat Jalan
            description: Mengambil data asesmen awal medis dokter umum rawat jalan berdasarkan ID kunjungan terenkripsi.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil mengambil detail penilaian medis
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail penilaian awal medis rawat jalan
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRalan"
                "404":
                    description: Data penilaian awal medis tidak ditemukan
        post:
            summary: Simpan Penilaian Awal Medis Rawat Jalan
            description: Menyimpan data asesmen awal medis dokter umum baru dengan proteksi 48 jam dan pencegahan duplikasi.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPenilaianMedisRalanRequest"
            responses:
                "201":
                    description: Berhasil menyimpan penilaian awal medis
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan penilaian awal medis rawat jalan
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRalan"
                "400":
                    description: Validasi input gagal atau data sudah ada
                "403":
                    description: Melebihi batas waktu 48 jam
        put:
            summary: Update Penilaian Awal Medis Rawat Jalan
            description: Memperbarui data asesmen awal medis dengan proteksi kepemilikan dokter dan batas waktu 48 jam.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePenilaianMedisRalanRequest"
            responses:
                "200":
                    description: Berhasil memperbarui penilaian awal medis
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui penilaian awal medis rawat jalan
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRalan"
                "400":
                    description: Validasi input gagal
                "403":
                    description: Bukan dokter pembuat atau melebihi batas waktu 48 jam
                "404":
                    description: Data penilaian awal medis tidak ditemukan
        delete:
            summary: Hapus Penilaian Awal Medis Rawat Jalan
            description: Menghapus data asesmen awal medis dengan proteksi kepemilikan dokter dan batas waktu 48 jam.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil menghapus penilaian awal medis
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "403":
                    description: Bukan dokter pembuat atau melebihi batas waktu 48 jam
                "404":
                    description: Data penilaian awal medis tidak ditemukan
    /api/v1/penilaian-medis/ralan/pasien/{id_pasien}:
        get:
            summary: Riwayat Penilaian Awal Medis Rawat Jalan Pasien
            description: Mengambil seluruh riwayat asesmen awal medis rawat jalan pasien berdasarkan nomor rekam medis terenkripsi.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
