            summary: Riwayat Penilaian Awal Medis Rawat Jalan Pasien
            description: Mengambil seluruh riwayat asesmen awal medis Rawat Jalan (Dokter Umum) pasien lintas kunjungan berdasarkan nomor rekam medis terenkripsi.
            security:
