paths:
    /api/v1/penilaian-medis/referensi:
        get:
            tags: [Penilaian Medis]
            summary: Daftar Opsi Dropdown Penilaian Medis
            description: Mengambil seluruh daftar opsi dropdown referensi (anamnesis, keadaan umum, tingkat kesadaran, dan status pemeriksaan fisik) untuk formulir asesmen medis dokter.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil opsi referensi penilaian medis
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil opsi referensi penilaian medis
                                    data:
                                        $ref: "#/components/schemas/ReferensiPenilaianMedis"
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/penilaian-medis/ralan/{id_kunjungan}:
        get:
            tags: [Penilaian Medis]
            summary: Detail Penilaian Awal Medis Rawat Jalan
            description: Mengambil data asesmen awal medis Rawat Jalan (Dokter Umum) lengkap berdasarkan token terenkripsi ID kunjungan (nomor rawat).
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil mengambil detail penilaian awal medis Rawat Jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail penilaian awal medis rawat jalan
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRalan"
                "400":
                    description: Token ID kunjungan tidak valid
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID kunjungan tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "404":
                    description: Data penilaian awal medis Rawat Jalan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data penilaian awal medis rawat jalan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        post:
            tags: [Penilaian Medis]
            summary: Simpan Penilaian Awal Medis Rawat Jalan
            description: |
                Menyimpan data asesmen awal medis Rawat Jalan (Dokter Umum) baru untuk kunjungan pasien.
                - `no_rawat` pada request body harus cocok dengan token `id_kunjungan` di path URL.
                - Waktu penilaian medis tidak boleh sebelum registrasi pasien dan tidak boleh melebihi waktu saat ini.
                - Batas waktu pengisian maksimal 48 jam sejak waktu registrasi kunjungan rawat jalan.
                - Pasien berstatus rawat inap yang telah keluar/checkout kamar inap ditolak.
                - Pasien BPJS tetap dapat diinputkan asesmen awalnya walaupun billing klaim sudah berstatus lunas bayar.
                - Pencegahan duplikasi: hanya diizinkan 1 asesmen awal medis rawat jalan per nomor rawat.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPenilaianMedisRalanRequest"
            responses:
                "201":
                    description: Berhasil menyimpan penilaian awal medis Rawat Jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan penilaian awal medis rawat jalan
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRalan"
                "400":
                    description: Validasi input gagal, nomor rawat tidak cocok, duplikasi data, atau aturan kamar inap dilanggar
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Penilaian medis rawat jalan untuk kunjungan ini sudah ada
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Melewati batas waktu 48 jam dari waktu registrasi pasien
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Penilaian medis tidak dapat disimpan, melewati batas 48 jam
                "404":
                    description: Data registrasi kunjungan pasien tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data kunjungan pasien tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        put:
            tags: [Penilaian Medis]
            summary: Update Penilaian Awal Medis Rawat Jalan
            description: |
                Memperbarui data asesmen awal medis Rawat Jalan (Dokter Umum).
                - Hanya dokter pembuat yang berhak memperbarui data asesmen.
                - Batas waktu perubahan maksimal 48 jam sejak waktu registrasi kunjungan rawat jalan.
                - Pasien berstatus rawat inap yang telah keluar/checkout kamar inap ditolak dari perubahan.
                - Waktu penilaian medis tidak boleh sebelum registrasi pasien dan tidak boleh melebihi waktu saat ini.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePenilaianMedisRalanRequest"
            responses:
                "200":
                    description: Berhasil memperbarui penilaian awal medis Rawat Jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui penilaian awal medis rawat jalan
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRalan"
                "400":
                    description: Parameter URL tidak valid, validasi input gagal, atau pasien sudah checkout
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Format data penilaian medis tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Bukan dokter pembuat data atau melewati batas waktu 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Penilaian medis dokter lain tidak dapat diubah
                "404":
                    description: Data penilaian awal medis Rawat Jalan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data penilaian awal medis rawat jalan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
        delete:
            tags: [Penilaian Medis]
            summary: Hapus Penilaian Awal Medis Rawat Jalan
            description: |
                Menghapus data asesmen awal medis Rawat Jalan (Dokter Umum) dari database.
                - Hanya dokter pembuat yang berhak menghapus data asesmen.
                - Batas waktu penghapusan maksimal 48 jam sejak waktu registrasi kunjungan rawat jalan.
                - Pasien berstatus rawat inap yang telah keluar/checkout kamar inap ditolak dari penghapusan.
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil menghapus penilaian awal medis Rawat Jalan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menghapus penilaian awal medis rawat jalan
                "400":
                    description: Token ID kunjungan tidak valid atau pasien sudah checkout
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID kunjungan tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "403":
                    description: Bukan dokter pembuat data atau melewati batas waktu 48 jam
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Penilaian medis dokter lain tidak dapat dihapus
                "404":
                    description: Data penilaian awal medis Rawat Jalan tidak ditemukan
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Data penilaian awal medis rawat jalan tidak ditemukan
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/penilaian-medis/ralan/pasien/{id_pasien}:
