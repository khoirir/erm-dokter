                - Pasien wajib masih berstatus aktif di kamar inap (belum checkout/pulang).
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Token terenkripsi ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil menghapus penilaian awal medis Rawat Inap Kandungan (Obgyn)
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menghapus penilaian awal medis rawat inap kandungan (obgyn)
                "400":
                    description: Token ID kunjungan tidak valid atau pasien sudah checkout
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: ID kunjungan tidak valid
                "401":
                    description: Token autentikasi tidak ada atau telah kedaluwarsa
                    content:
