            responses:
                "200":
                    description: Berhasil mengambil riwayat penilaian awal medis pasien
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil riwayat penilaian awal medis rawat jalan pasien
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/PenilaianMedisRalan"
