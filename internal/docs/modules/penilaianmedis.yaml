    /api/v1/penilaian-medis/ranap/{id_kunjungan}:
        get:
            summary: Detail Penilaian Awal Medis Rawat Inap (Ranap)
            description: Mengambil data asesmen awal medis rawat inap pasien berdasarkan nomor rawat kunjungan terenkripsi.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil mengambil detail penilaian awal medis rawat inap
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil detail penilaian awal medis rawat inap
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRanap"
                "400":
                    description: ID kunjungan tidak valid
                "401":
                    description: Token autentikasi tidak valid atau kedaluwarsa
                "404":
                    description: Data penilaian awal medis rawat inap tidak ditemukan
        post:
            summary: Simpan Penilaian Awal Medis Rawat Inap (Ranap)
            description: Menyimpan asesmen awal medis rawat inap baru oleh dokter. Pasien wajib terdaftar dan aktif di kamar inap.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SimpanPenilaianMedisRanapRequest"
            responses:
                "201":
                    description: Berhasil menyimpan penilaian awal medis rawat inap
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil menyimpan penilaian awal medis rawat inap
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRanap"
                "400":
                    description: Validasi gagal, nomor rawat tidak cocok, belum terdaftar kamar inap, atau data sudah ada
                "401":
                    description: Token autentikasi tidak valid atau kedaluwarsa
        put:
            summary: Update Penilaian Awal Medis Rawat Inap (Ranap)
            description: Memperbarui data penilaian awal medis rawat inap. Hanya dokter pembuat yang berhak memperbarui dan pasien masih aktif di kamar inap.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdatePenilaianMedisRanapRequest"
            responses:
                "200":
                    description: Berhasil memperbarui penilaian awal medis rawat inap
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil memperbarui penilaian awal medis rawat inap
                                    data:
                                        $ref: "#/components/schemas/PenilaianMedisRanap"
                "400":
                    description: Validasi gagal atau pasien sudah checkout dari kamar inap
                "401":
                    description: Token autentikasi tidak valid atau kedaluwarsa
                "403":
                    description: Bukan dokter pembuat
                "404":
                    description: Data penilaian awal medis rawat inap tidak ditemukan
        delete:
            summary: Hapus Penilaian Awal Medis Rawat Inap (Ranap)
            description: Menghapus data penilaian awal medis rawat inap. Hanya dokter pembuat yang berhak menghapus.
            tags:
                - Penilaian Medis
            security:
                - BearerAuth: []
            parameters:
                - name: id_kunjungan
                  in: path
                  required: true
                  description: Encrypted ID Nomor Rawat Kunjungan
                  schema:
                    type: string
            responses:
                "200":
                    description: Berhasil menghapus penilaian awal medis rawat inap
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "400":
                    description: Pasien sudah checkout dari kamar inap
                "401":
                    description: Token autentikasi tidak valid atau kedaluwarsa
                "403":
                    description: Bukan dokter pembuat
                "404":
                    description: Data penilaian awal medis rawat inap tidak ditemukan
