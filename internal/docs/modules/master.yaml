    /api/v1/master/icd10:
        get:
            tags: [Master]
            summary: Daftar & Pencarian Master ICD-10
            description: Mengambil daftar master diagnosa ICD-10 dengan dukungan pencarian kata kunci dan paginasi.
            security:
                - BearerAuth: []
            parameters:
                - name: keyword
                  in: query
                  required: false
                  description: Kata kunci pencarian kode atau nama diagnosa (minimal 3 karakter jika diisi)
                  schema:
                      type: string
                      example: stroke
                - name: page
                  in: query
                  required: false
                  description: Nomor halaman
                  schema:
                      type: integer
                      default: 1
                      example: 1
                - name: limit
                  in: query
                  required: false
                  description: Jumlah data per halaman (maksimal 100)
                  schema:
                      type: integer
                      default: 20
                      example: 20
            responses:
                "200":
                    description: Berhasil mengambil daftar master ICD-10
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                    - meta
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar master ICD-10
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/ICD10"
                                    meta:
                                        $ref: "#/components/schemas/PaginationMeta"
                "400":
                    description: Validasi query parameter gagal (kata kunci kurang dari 3 karakter)
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Validasi gagal
                                    error:
                                        type: object
                                        properties:
                                            keyword:
                                                type: string
                                                example: Kata kunci pencarian minimal 3 karakter
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
    /api/v1/master/icd9:
