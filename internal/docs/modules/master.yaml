paths:
    /api/v1/master/penjamin:
        get:
            tags: [Master]
            summary: Daftar Master Penjamin
            description: Mengambil seluruh daftar master penjamin atau asuransi pasien yang aktif.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Berhasil mengambil daftar penjamin
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - data
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Berhasil mengambil daftar penjamin
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Penjamin"
                "401":
                    description: Token tidak ada atau telah kedaluwarsa
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Kredensial login tidak valid atau telah kedaluwarsa
                "500":
                    description: Terjadi kesalahan pada server internal
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: Terjadi kesalahan pada server
