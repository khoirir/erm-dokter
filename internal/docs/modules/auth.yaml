paths:
    /api/v1/auth/login:
        post:
            tags: [Auth]
            summary: Login Dokter
            description: Otentikasi menggunakan username dan password dokter Khanza. Mengembalikan token JWT yang berlaku 24 jam.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Login Berhasil
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/BaseResponse"
                                    - type: object
                                      properties:
                                        data:
                                            $ref: "#/components/schemas/LoginData"
                "400":
                    description: Format request JSON tidak valid atau validasi input gagal
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: Username atau password salah
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Terlalu banyak percobaan login (Rate limit 10 req/menit)
    /api/v1/auth/logout:
        post:
            tags: [Auth]
            summary: Logout Dokter
            description: |
                Endpoint logout untuk mengakhiri sesi dokter dan menginstruksikan client untuk membersihkan Bearer Token JWT.
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Logout Berhasil
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/BaseResponse"
                "401":
                    description: Token tidak ada atau sudah kadaluarsa
components:
    schemas:
        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                    description: Username / ID Dokter di Khanza
                    example: DRHANDI
                password:
                    type: string
                    description: Password akun dokter
                    example: "1"
        LoginData:
            type: object
            properties:
                token:
                    type: string
                    description: JWT Access Token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                kode_dokter:
                    type: string
                    description: Kode Dokter di Khanza
                    example: DR001
                nama_dokter:
                    type: string
                    description: Nama Lengkap Dokter
                    example: dr. Handi, Sp.PD
